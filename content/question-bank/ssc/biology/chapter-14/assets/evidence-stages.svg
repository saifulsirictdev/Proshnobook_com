<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Evidence is not interchangeable</title><desc id="desc">DNA presence, protein expression, function, contextual performance and applicable safety/approval are distinct forms of evidence. One positive result does not certify the others.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Evidence is not interchangeable</text><text x="30" y="90" font-size="20" fill="#183449">Different questions require different evidence</text><rect x="175" y="125" width="740" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="190" y="164.5" font-size="20" fill="#183449">DNA: is the intended sequence present?</text><path d="M500 192 L500 217 M493 205 L500 217 L507 205" fill="none" stroke="#234e67" stroke-width="3"/><rect x="175" y="220" width="740" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="190" y="259.5" font-size="20" fill="#183449">Protein: is the intended product expressed?</text><path d="M500 287 L500 312 M493 300 L500 312 L507 300" fill="none" stroke="#234e67" stroke-width="3"/><rect x="175" y="315" width="740" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="190" y="354.5" font-size="20" fill="#183449">Activity: does the product function?</text><path d="M500 382 L500 407 M493 395 L500 407 L507 395" fill="none" stroke="#234e67" stroke-width="3"/><rect x="175" y="410" width="740" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="190" y="449.5" font-size="20" fill="#183449">Field / use: does it work in context?</text><path d="M500 477 L500 502 M493 490 L500 502 L507 490" fill="none" stroke="#234e67" stroke-width="3"/><rect x="175" y="505" width="740" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="190" y="544.5" font-size="20" fill="#183449">Safety / approval: separate applicable review</text><text x="30" y="655" font-size="19" fill="#183449">A positive result at one stage does not establish every later claim.</text></g></svg>
