<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Plant tissue culture: a simplified route</title><desc id="desc">Explant, controlled culture, shoot and root development, gradual acclimatization, external growing conditions. Callus is not mandatory in every route; plant health needs separate checks.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Plant tissue culture: a simplified route</text><text x="30" y="90" font-size="20" fill="#183449">Conceptual route; not every species needs a callus stage</text><rect x="220" y="125" width="580" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="235" y="164.5" font-size="20" fill="#183449">Selected healthy source / explant</text><path d="M500 192 L500 217 M493 205 L500 217 L507 205" fill="none" stroke="#234e67" stroke-width="3"/><rect x="220" y="220" width="580" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="235" y="259.5" font-size="20" fill="#183449">Appropriate controlled culture</text><path d="M500 287 L500 312 M493 300 L500 312 L507 300" fill="none" stroke="#234e67" stroke-width="3"/><rect x="220" y="315" width="580" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="235" y="354.5" font-size="20" fill="#183449">Shoot and root development</text><path d="M500 382 L500 407 M493 395 L500 407 L507 395" fill="none" stroke="#234e67" stroke-width="3"/><rect x="220" y="410" width="580" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="235" y="449.5" font-size="20" fill="#183449">Gradual acclimatization</text><path d="M500 477 L500 502 M493 490 L500 502 L507 490" fill="none" stroke="#234e67" stroke-width="3"/><rect x="220" y="505" width="580" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="235" y="544.5" font-size="20" fill="#183449">Suitable external growing conditions</text><text x="30" y="655" font-size="19" fill="#183449">Clean surfaces do not prove virus freedom; test plant health separately.</text></g></svg>
