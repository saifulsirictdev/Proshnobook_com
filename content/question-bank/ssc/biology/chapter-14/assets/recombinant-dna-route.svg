<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Recombinant DNA: components and checks</title><desc id="desc">Target DNA and vector are joined in a compatible construct; host uptake, construct verification, expression and product quality are distinct checks. Not a protocol.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Recombinant DNA: components and checks</text><text x="30" y="90" font-size="20" fill="#183449">Conceptual information flow; no laboratory operating conditions</text><rect x="40" y="130" width="400" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="55" y="169.5" font-size="20" fill="#183449">Donor DNA: target region</text><rect x="560" y="130" width="400" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="575" y="169.5" font-size="20" fill="#183449">Vector DNA</text><path d="M240 195 L500 260 M760 195 L500 260" fill="none" stroke="#234e67" stroke-width="3"/><rect x="210" y="265" width="650" height="58" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="225" y="301.0" font-size="20" fill="#183449">Compatible DNA ends + ligase</text><path d="M500 325 L500 347 M493 335 L500 347 L507 335" fill="none" stroke="#234e67" stroke-width="3"/><rect x="210" y="350" width="650" height="58" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="225" y="386.0" font-size="20" fill="#183449">Recombinant DNA construct</text><path d="M500 410 L500 432 M493 420 L500 432 L507 420" fill="none" stroke="#234e67" stroke-width="3"/><rect x="210" y="435" width="650" height="58" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="225" y="471.0" font-size="20" fill="#183449">Host uptake and appropriate checks</text><path d="M500 495 L500 517 M493 505 L500 517 L507 505" fill="none" stroke="#234e67" stroke-width="3"/><rect x="210" y="520" width="650" height="58" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="225" y="556.0" font-size="20" fill="#183449">Expression and product quality checks</text><text x="30" y="655" font-size="19" fill="#183449">Marker selection alone does not prove the correct insert or active protein.</text></g></svg>
