<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Digestive tract: two kinds of route</title><desc id="desc">Food passes mouth, esophagus, stomach, small intestine, large intestine, rectum and anus. Liver produces bile, gallbladder stores it, and pancreas secretes digestive juice. These secretions enter duodenum; food does not pass through the accessory organs.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Digestive tract: two kinds of route</text><text x="40" y="90" font-family="sans-serif" font-size="20" fill="#173d36">Food route (solid arrows) and secretion routes (blue)</text><rect x="45" y="130" width="180" height="60" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="60" y="167" font-family="sans-serif" font-size="21" fill="#173d36">Mouth</text><rect x="290" y="130" width="190" height="60" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="305" y="167" font-family="sans-serif" font-size="21" fill="#173d36">Esophagus</text><rect x="555" y="130" width="220" height="60" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="570" y="167" font-family="sans-serif" font-size="21" fill="#173d36">Stomach</text><rect x="555" y="290" width="280" height="65" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="570" y="327" font-family="sans-serif" font-size="21" fill="#173d36">Small intestine</text><rect x="555" y="435" width="280" height="60" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="570" y="472" font-family="sans-serif" font-size="21" fill="#173d36">Large intestine</text><rect x="45" y="435" width="380" height="60" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="60" y="472" font-family="sans-serif" font-size="21" fill="#173d36">Rectum → anus</text><rect x="45" y="240" width="180" height="55" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="60" y="277" font-family="sans-serif" font-size="21" fill="#173d36">Liver</text><rect x="270" y="240" width="210" height="55" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="285" y="277" font-family="sans-serif" font-size="21" fill="#173d36">Gallbladder</text><rect x="45" y="335" width="240" height="55" rx="12" fill="#e1efe8" stroke="#173d36" stroke-width="2"/><text x="60" y="372" font-family="sans-serif" font-size="21" fill="#173d36">Pancreas</text><path d="M225 160 L285 160 M274.19 165.22 L285 160 L274.19 154.78" fill="none" stroke="#173d36" stroke-width="3"/><path d="M480 160 L550 160 M539.19 165.22 L550 160 L539.19 154.78" fill="none" stroke="#173d36" stroke-width="3"/><path d="M770 195 L770 285 M764.78 274.19 L770 285 L775.22 274.19" fill="none" stroke="#173d36" stroke-width="3"/><path d="M695 360 L695 430 M689.78 419.19 L695 430 L700.22 419.19" fill="none" stroke="#173d36" stroke-width="3"/><path d="M550 465 L430 465 M440.81 459.78 L430 465 L440.81 470.22" fill="none" stroke="#173d36" stroke-width="3"/><path d="M225 268 L265 268 M254.19 273.22 L265 268 L254.19 262.78" fill="none" stroke="#347cab" stroke-width="3"/><path d="M480 268 L550 313 M538.09 311.55 L550 313 L543.73 302.77" fill="none" stroke="#347cab" stroke-width="3"/><path d="M285 363 L550 340 M539.69 346.13 L550 340 L538.78 335.73" fill="none" stroke="#347cab" stroke-width="3"/><text x="315" y="395" font-family="sans-serif" font-size="18" fill="#347cab">Juices enter duodenum</text><text x="45" y="535" font-family="sans-serif" font-size="21" fill="#173d36">Food does not pass through liver, gallbladder or pancreas.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
