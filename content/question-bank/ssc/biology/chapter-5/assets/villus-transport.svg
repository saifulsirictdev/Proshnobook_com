<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A villus: surface area and transport</title><desc id="desc">A tissue-level villus has a thin epithelium, blood capillaries and a central lacteal. Microvilli are much smaller cell membrane projections on its surface. Glucose and amino acids chiefly enter blood; chylomicrons enter the lacteal. Simplified, not to scale.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">A villus: surface area and transport</text><text x="35" y="90" font-family="sans-serif" font-size="21" fill="#173d36">Intestinal lumen: absorbed nutrients move into epithelium</text><path d="M180 495 L180 265 C180 100 580 100 580 265 L580 495 Z" fill="#f9e7cb" stroke="#8b704a" stroke-width="5"/><path d="M240 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M275 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M310 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M345 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M380 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M415 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M450 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M485 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M520 162 l-5 -22" stroke="#8b704a" stroke-width="4"/><path d="M265 490 L265 300 C265 235 490 235 490 300 L490 490" fill="none" stroke="#c25e69" stroke-width="12"/><rect x="360" y="285" width="65" height="210" rx="28" fill="#b7d9be" stroke="#427a56" stroke-width="2"/><path d="M640 160 L515 145 M526.35 141.11 L515 145 L525.11 151.47" fill="none" stroke="#173d36" stroke-width="3"/><text x="650" y="175" font-family="sans-serif" font-size="22" fill="#173d36">Microvilli</text><text x="650" y="205" font-family="sans-serif" font-size="18" fill="#173d36">on cell surface</text><path d="M650 275 L575 285 M585.02 278.40 L575 285 L586.40 288.75" fill="none" stroke="#173d36" stroke-width="3"/><text x="660" y="274" font-family="sans-serif" font-size="21" fill="#173d36">Thin epithelium</text><path d="M650 365 L495 365 M505.81 359.78 L495 365 L505.81 370.22" fill="none" stroke="#c25e69" stroke-width="3"/><text x="660" y="360" font-family="sans-serif" font-size="21" fill="#173d36">Blood capillaries</text><path d="M650 445 L430 445 M440.81 439.78 L430 445 L440.81 450.22" fill="none" stroke="#427a56" stroke-width="3"/><text x="660" y="438" font-family="sans-serif" font-size="21" fill="#173d36">Central lacteal</text><text x="45" y="535" font-family="sans-serif" font-size="21" fill="#173d36">Villus = tissue projection; microvilli = cell membrane projections</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
