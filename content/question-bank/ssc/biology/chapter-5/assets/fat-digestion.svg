<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Two distinct steps in fat digestion</title><desc id="desc">P shows bile salts dispersing a large fat droplet into smaller droplets without hydrolysing triacylglycerol bonds. Q shows lipase-catalysed hydrolysis producing chiefly fatty acids and monoglycerides. Bile is not a digestive enzyme.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Two distinct steps in fat digestion</text><text x="45" y="100" font-family="sans-serif" font-size="25" fill="#173d36">P: physical dispersal (bile salts)</text><rect x="50" y="150" width="210" height="110" rx="50" fill="#f9d692" stroke="#c29843" stroke-width="2"/><text x="80" y="213" font-family="sans-serif" font-size="22" fill="#173d36">Large droplet</text><path d="M270 205 L400 205 M389.19 210.22 L400 205 L389.19 199.78" fill="none" stroke="#173d36" stroke-width="3"/><rect x="440" y="150" width="70" height="45" rx="20" fill="#f9d692" stroke="#c29843" stroke-width="2"/><rect x="550" y="150" width="70" height="45" rx="20" fill="#f9d692" stroke="#c29843" stroke-width="2"/><rect x="440" y="220" width="70" height="45" rx="20" fill="#f9d692" stroke="#c29843" stroke-width="2"/><rect x="550" y="220" width="70" height="45" rx="20" fill="#f9d692" stroke="#c29843" stroke-width="2"/><text x="650" y="185" font-family="sans-serif" font-size="23" fill="#173d36">Smaller droplets</text><text x="650" y="220" font-family="sans-serif" font-size="21" fill="#173d36">More surface area</text><text x="45" y="330" font-family="sans-serif" font-size="25" fill="#173d36">Q: chemical hydrolysis (lipase)</text><rect x="50" y="370" width="260" height="75" rx="15" fill="#f9d692" stroke="#c29843" stroke-width="2"/><text x="78" y="415" font-family="sans-serif" font-size="23" fill="#173d36">Triacylglycerol</text><path d="M320 407 L500 407 M489.19 412.22 L500 407 L489.19 401.78" fill="none" stroke="#173d36" stroke-width="3"/><text x="355" y="385" font-family="sans-serif" font-size="20" fill="#173d36">+ water</text><rect x="515" y="370" width="435" height="75" rx="15" fill="#e0eee4" stroke="#82a58e" stroke-width="2"/><text x="535" y="415" font-family="sans-serif" font-size="23" fill="#173d36">Fatty acids + monoglycerides</text><text x="45" y="515" font-family="sans-serif" font-size="22" fill="#173d36">P changes droplet arrangement; Q changes molecular bonds.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
