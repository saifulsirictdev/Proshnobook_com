<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Neuron structure and chemical communication</title><desc id="desc">Simplified multipolar neuron. A dendrites, B soma containing nucleus, C axon wrapped in separate myelin segments, D unmyelinated gap or node between segments, E axon terminals. General output arrow runs left to right. Separate written inset describes a chemical synapse: transmitter release, diffusion across cleft, receptor response and termination. Not all neurons have this shape or myelin, and not every input produces an output spike.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Neuron structure and chemical communication</text><path d="M210 200 L170 140 M180 155 L125 155 M175 150 L170 105 M210 240 L135 265 M165 255 L130 300 M210 280 L175 325" stroke="#173d36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 185 Q290 155 315 230 Q335 295 255 310 Q200 300 210 185 Z" stroke="#173d36" stroke-width="3" fill="#dbe8de" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 225 Q270 205 285 230 Q295 255 270 265 Q245 265 245 225 Z" stroke="#173d36" stroke-width="2" fill="#c1d4e7" stroke-linecap="round" stroke-linejoin="round"/><path d="M315 245 L840 245 M840 245 L895 200 M840 245 L895 290" stroke="#173d36" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="221" width="85" height="48" rx="12" fill="#e1cda9" stroke="#173d36" stroke-width="2"/><rect x="475" y="221" width="85" height="48" rx="12" fill="#e1cda9" stroke="#173d36" stroke-width="2"/><rect x="590" y="221" width="85" height="48" rx="12" fill="#e1cda9" stroke="#173d36" stroke-width="2"/><rect x="705" y="221" width="85" height="48" rx="12" fill="#e1cda9" stroke="#173d36" stroke-width="2"/><text x="55" y="95" font-family="sans-serif" font-size="23" fill="#173d36">A  Dendrites</text><path d="M190 110 L175 140 M183.709109057633 133.28051940829837 L175 140 L175.1501190387815 129.00102439887263" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="305" y="145" font-family="sans-serif" font-size="22" fill="#173d36">B  Cell body / nucleus</text><path d="M360 155 L278 225 M288.6398034602632 222.20812207878424 L278 225 L282.4268547872571 214.93009649040576" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="355" font-family="sans-serif" font-size="22" fill="#173d36">C  Axon + myelin</text><path d="M560 335 L550 248 M546.3777253019284 258.38648766483215 L550 248 L555.884373224241 257.2937695128422" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="105" font-family="sans-serif" font-size="22" fill="#173d36">D  Node of Ranvier</text><path d="M630 120 L579 242 M587.2346479609213 234.70681325073218 L579 242 L578.4057898200682 231.0160610770969" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="355" font-family="sans-serif" font-size="22" fill="#173d36">E  Terminals</text><path d="M885 330 L890 285 M884.1508279112483 294.315964033645 L890 285 L893.6615416401772 295.372710003526" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 395 L795 395 M785.0950818741205 390.21537912477646 L795 395 L785.0950818741205 399.78462087522354" stroke="#4c8290" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="430" font-family="sans-serif" font-size="22" fill="#173d36">Typical signal output direction</text><rect x="90" y="470" width="920" height="140" rx="12" fill="#edf2f0" stroke="#173d36" stroke-width="2"/><text x="115" y="505" font-family="sans-serif" font-size="22" fill="#173d36">Chemical synapse:</text><text x="115" y="545" font-family="sans-serif" font-size="22" fill="#173d36">terminal releases transmitter → cleft → receptor on next cell</text><text x="115" y="580" font-family="sans-serif" font-size="21" fill="#173d36">Not direct fusion; signal termination also matters.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
