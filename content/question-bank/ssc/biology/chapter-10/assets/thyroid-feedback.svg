<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Thyroid-axis feedback: a normal control model</title><desc id="desc">Functional endocrine-axis chart. Hypothalamic stimulation acts on pituitary TSH, which stimulates thyroid T3 and T4 output. Thyroid hormones act on target tissues and feed back to reduce hypothalamic and pituitary stimulation; flat bars indicate inhibition. The feedback line starts from thyroid hormone output, not from the target-tissue effect label. This selected normal-axis model is not a body location map or clinical diagnostic/dose algorithm.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Thyroid-axis feedback: a normal control model</text><rect x="90" y="115" width="350" height="85" rx="12" fill="#d5e3ed" stroke="#173d36" stroke-width="2"/><text x="125" y="165" font-family="sans-serif" font-size="24" fill="#173d36">Hypothalamic signal</text><path d="M265 205 L265 270 M269.78462087522354 260.0950818741206 L265 270 L260.21537912477646 260.0950818741206" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="275" width="350" height="85" rx="12" fill="#d5e8de" stroke="#173d36" stroke-width="2"/><text x="125" y="325" font-family="sans-serif" font-size="24" fill="#173d36">Pituitary: TSH</text><path d="M265 365 L265 430 M269.78462087522354 420.0950818741206 L265 430 L260.21537912477646 420.0950818741206" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="435" width="350" height="85" rx="12" fill="#ead9c3" stroke="#173d36" stroke-width="2"/><text x="125" y="485" font-family="sans-serif" font-size="24" fill="#173d36">Thyroid: T3 / T4</text><path d="M445 478 L740 478 M730.0950818741205 473.21537912477646 L740 478 L730.0950818741205 482.78462087522354" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="465" font-family="sans-serif" font-size="24" fill="#173d36">Target tissues</text><text x="760" y="505" font-family="sans-serif" font-size="22" fill="#173d36">Metabolic effects</text><path d="M570 475 L570 155 L455 155 M455 135 L455 175" stroke="#a66368" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M570 315 L455 315 M455 295 L455 335" stroke="#a66368" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="220" font-family="sans-serif" font-size="24" fill="#a66368">Negative feedback</text><text x="620" y="260" font-family="sans-serif" font-size="21" fill="#173d36">More thyroid hormone can</text><text x="620" y="295" font-family="sans-serif" font-size="21" fill="#173d36">reduce upstream stimulation.</text><text x="75" y="590" font-family="sans-serif" font-size="21" fill="#173d36">Arrow = stimulation / signal route. Flat bar = inhibition.</text><text x="75" y="625" font-family="sans-serif" font-size="21" fill="#173d36">Normal control model, not a diagnostic algorithm or hormone-dose guide.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
