<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Lungs and conducting airways: orientation guide</title><desc id="desc">Front-view schematic, not to scale. Patient right lung is on viewer left with three lobes; patient left lung is on viewer right with two lobes and space for the heart. Trachea divides into two bronchi, then smaller branches lead toward alveoli. Diaphragm lies below. Pleura is described in the written stimulus but not separately drawn as a layer here.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Lungs and conducting airways: orientation guide</text><text x="80" y="95" font-family="sans-serif" font-size="20" fill="#173d36">Front view: patient right is viewer left</text><rect x="475" y="105" width="50" height="165" rx="14" fill="#dbe7e9" stroke="#53787d" stroke-width="2"/><text x="555" y="150" font-family="sans-serif" font-size="23" fill="#173d36">Trachea</text><path d="M480 125 L520 125" stroke="#53787d" stroke-width="3"/><path d="M480 148 L520 148" stroke="#53787d" stroke-width="3"/><path d="M480 171 L520 171" stroke="#53787d" stroke-width="3"/><path d="M480 194 L520 194" stroke="#53787d" stroke-width="3"/><path d="M480 217 L520 217" stroke="#53787d" stroke-width="3"/><path d="M480 240 L520 240" stroke="#53787d" stroke-width="3"/><path d="M465 205 C380 130 240 210 225 450 Q340 510 460 455 Z" fill="#eed2d0" stroke="#926c69" stroke-width="3"/><path d="M535 205 C620 135 760 210 775 450 Q670 505 540 455 L560 340 L535 310 Z" fill="#eed2d0" stroke="#926c69" stroke-width="3"/><path d="M240 325 L460 325 M250 375 L460 405 M550 360 L762 300" fill="none" stroke="#926c69" stroke-width="3"/><path d="M500 260 L405 300 M500 260 L610 300 M405 300 L340 255 M405 300 L335 390 M610 300 L665 250 M610 300 L680 405" stroke="#53787d" stroke-width="15" fill="none" stroke-linecap="round"/><text x="45" y="185" font-family="sans-serif" font-size="22" fill="#173d36">Right lung</text><text x="45" y="215" font-family="sans-serif" font-size="20" fill="#173d36">3 lobes</text><path d="M165 210 L250 250 M238.00 250.12 L250 250 L242.45 240.68" fill="none" stroke="#173d36" stroke-width="3"/><text x="800" y="185" font-family="sans-serif" font-size="22" fill="#173d36">Left lung</text><text x="800" y="215" font-family="sans-serif" font-size="20" fill="#173d36">2 lobes</text><path d="M800 225 L735 250 M743.21 241.25 L735 250 L746.96 250.99" fill="none" stroke="#173d36" stroke-width="3"/><text x="60" y="400" font-family="sans-serif" font-size="21" fill="#173d36">Bronchi</text><path d="M165 390 L393 305 M384.70 313.67 L393 305 L381.05 303.88" fill="none" stroke="#173d36" stroke-width="3"/><text x="790" y="400" font-family="sans-serif" font-size="20" fill="#173d36">Smaller</text><text x="790" y="425" font-family="sans-serif" font-size="20" fill="#173d36">branches</text><path d="M785 380 L682 398 M691.75 391.00 L682 398 L693.54 401.28" fill="none" stroke="#173d36" stroke-width="3"/><path d="M210 530 Q500 425 790 530" stroke="#6a9172" stroke-width="12" fill="none"/><text x="395" y="550" font-family="sans-serif" font-size="23" fill="#173d36">Diaphragm</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
