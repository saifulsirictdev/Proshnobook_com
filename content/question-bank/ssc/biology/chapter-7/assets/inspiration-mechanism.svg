<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Inspiration: one causal chain</title><desc id="desc">Diaphragm contraction moves it downward, increasing thoracic volume and expanding the lungs through pleural coupling. Alveolar pressure becomes slightly lower than atmospheric pressure, so air flows inward. Quiet expiration mainly follows relaxation and elastic recoil; forced expiration can recruit extra muscles. This flow map is not a pressure tracing.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Inspiration: one causal chain</text><rect x="55" y="100" width="420" height="80" rx="12" fill="#e1ece7" stroke="#718f83" stroke-width="2"/><text x="73" y="147" font-family="sans-serif" font-size="21" fill="#173d36">Diaphragm contracts and descends</text><rect x="540" y="100" width="390" height="80" rx="12" fill="#e1ece7" stroke="#718f83" stroke-width="2"/><text x="558" y="147" font-family="sans-serif" font-size="21" fill="#173d36">Thoracic / lung volume increases</text><rect x="540" y="260" width="390" height="80" rx="12" fill="#e1ece7" stroke="#718f83" stroke-width="2"/><text x="558" y="307" font-family="sans-serif" font-size="21" fill="#173d36">Alveolar pressure falls briefly</text><rect x="55" y="260" width="420" height="80" rx="12" fill="#e1ece7" stroke="#718f83" stroke-width="2"/><text x="73" y="307" font-family="sans-serif" font-size="21" fill="#173d36">Air moves inward via airways</text><path d="M480 140 L535 140 M524.19 145.22 L535 140 L524.19 134.78" fill="none" stroke="#173d36" stroke-width="3"/><path d="M735 185 L735 255 M729.78 244.19 L735 255 L740.22 244.19" fill="none" stroke="#173d36" stroke-width="3"/><path d="M535 300 L480 300 M490.81 294.78 L480 300 L490.81 305.22" fill="none" stroke="#173d36" stroke-width="3"/><text x="65" y="415" font-family="sans-serif" font-size="23" fill="#173d36">Pressure compared with atmosphere, not absolute zero.</text><text x="65" y="465" font-family="sans-serif" font-size="22" fill="#173d36">Pleural coupling links chest movement to lung expansion.</text><text x="65" y="515" font-family="sans-serif" font-size="21" fill="#173d36">Quiet expiration: relaxation + elastic recoil → outward airflow.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
