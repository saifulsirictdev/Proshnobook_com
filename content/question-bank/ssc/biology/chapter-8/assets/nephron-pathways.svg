<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Nephron: separate blood and tubular routes</title><desc id="desc">P is the glomerular capillary tuft within Q, Bowman capsule. Blood enters by afferent and exits by efferent arteriole toward peritubular capillaries (not fully drawn). Filtrate enters proximal convoluted tubule, descending and ascending Henle loop, distal convoluted tubule, then collecting duct. A guide marks cortical and medullary regions; geometry is simplified. Gold arrows mark tubular fluid, not whole blood.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Nephron: separate blood and tubular routes</text><rect x="45" y="100" width="280" height="160" rx="12" fill="#e5e9ef" stroke="#173d36" stroke-width="2"/><text x="62" y="128" font-family="sans-serif" font-size="21" fill="#173d36">Q  Bowman capsule</text><path d="M85 172 C90 125 170 145 130 190 C90 235 195 230 182 175 C172 125 245 162 202 210 C180 237 252 235 258 195" stroke="#b95361" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="247" font-family="sans-serif" font-size="21" fill="#173d36">P  Glomerulus</text><path d="M45 175 L83 175 M73.09508187412055 170.21537912477646 L83 175 L73.09508187412055 179.78462087522354" stroke="#b95361" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="87" font-family="sans-serif" font-size="19" fill="#173d36">Afferent blood</text><path d="M256 190 L300 190 L300 90 L440 90" stroke="#b95361" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 90 L438 90 M428.0950818741206 85.21537912477646 L438 90 L428.0950818741206 94.78462087522354" stroke="#b95361" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="96" font-family="sans-serif" font-size="21" fill="#173d36">Efferent → peritubular capillaries</text><path d="M277 218 L330 285 M327.6074557940852 274.2633463210019 L330 285 L320.102460925965 280.2001333062313" stroke="#b58a29" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="280" width="155" height="70" rx="12" fill="#f5e5b9" stroke="#173d36" stroke-width="2"/><text x="365" y="323" font-family="sans-serif" font-size="25" fill="#173d36">PCT</text><path d="M490 315 L550 315 L550 490 Q600 555 650 490 L650 315 L705 315" stroke="#b58a29" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 365 L550 440 M554.7846208752235 430.0950818741206 L550 440 L545.2153791247765 430.0950818741206" stroke="#9b7826" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 445 L650 370 M645.2153791247765 379.9049181258794 L650 370 L654.7846208752235 379.9049181258794" stroke="#9b7826" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="705" y="280" width="135" height="70" rx="12" fill="#f5e5b9" stroke="#173d36" stroke-width="2"/><text x="735" y="323" font-family="sans-serif" font-size="25" fill="#173d36">DCT</text><path d="M840 315 L910 315 M900.0950818741205 310.21537912477646 L910 315 L900.0950818741205 319.78462087522354" stroke="#b58a29" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="915" y="265" width="60" height="290" rx="12" fill="#ead69b" stroke="#173d36" stroke-width="2"/><path d="M945 390 L945 510 M949.7846208752235 500.0950818741206 L945 510 L940.2153791247765 500.0950818741206" stroke="#9b7826" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="560" font-family="sans-serif" font-size="23" fill="#173d36">Loop of Henle</text><text x="855" y="590" font-family="sans-serif" font-size="22" fill="#173d36">Collecting duct</text><path d="M35 385 L505 385 M685 385 L885 385" stroke="#a6b5a9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="365" font-family="sans-serif" font-size="22" fill="#173d36">Cortex</text><text x="40" y="420" font-family="sans-serif" font-size="22" fill="#173d36">Medulla (below guide)</text><text x="45" y="610" font-family="sans-serif" font-size="21" fill="#173d36">Gold arrows: tubular fluid. Red: blood. No whole-blood mixing into the tubule.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
