<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><title>MITOTIC ANAPHASE</title><desc>Four independent single-chromatid chromosomes in the undivided cell. Two go toward each pole.</desc><rect width="900" height="520" rx="20" fill="#f3f8f6"/><g font-family="DejaVu Sans, sans-serif" fill="#193e34" font-size="20"><text x="30" y="40" font-size="25">MITOTIC ANAPHASE</text><text x="30" y="75" font-size="17">Starting cell: 2n = 2. Sisters have separated; the cell is still undivided.</text><rect x="100" y="110" width="700" height="300" rx="130" fill="#edf0df" stroke="#56826b" stroke-width="4"/><path d="M150 260 L300 200 M150 260 L300 320 M750 260 L600 200 M750 260 L600 320" stroke="#8faaa0" stroke-width="2"/><path d="M330 170 L300 200 L330 230 M570 170 L600 200 L570 230" fill="none" stroke="#be6855" stroke-width="9" stroke-linecap="round"/><path d="M330 290 L300 320 L330 350 M570 290 L600 320 L570 350" fill="none" stroke="#557db1" stroke-width="9" stroke-linecap="round"/><path d="M390 260 H260 L275 250 M260 260 L275 270 M510 260 H640 L625 250 M640 260 L625 270" stroke="#193e34" stroke-width="3" fill="none"/><text x="155" y="445">2 toward left pole</text><text x="565" y="445">2 toward right pole</text><text x="30" y="480" font-size="16">Original selected-structure schematic. Not to scale. Colours are identifiers only.</text></g></svg>
