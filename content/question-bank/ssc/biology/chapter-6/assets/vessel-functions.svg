<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Three vessel types: form supports function</title><desc id="desc">A has a thick elastic muscular wall for arterial pressure. B has a thinner wall, wider lumen and a valve supporting venous return. C has a very thin endothelial exchange barrier. Not all veins have valves and exact dimensions vary; diagrams are not to scale.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Three vessel types: form supports function</text><text x="50" y="105" font-family="sans-serif" font-size="25" fill="#173d36">A: artery</text><text x="405" y="105" font-family="sans-serif" font-size="25" fill="#173d36">B: vein</text><text x="755" y="105" font-family="sans-serif" font-size="25" fill="#173d36">C: capillary</text><rect x="50" y="160" width="280" height="285" rx="70" fill="#e3b4af" stroke="#9e6662" stroke-width="2"/><rect x="115" y="210" width="150" height="185" rx="50" fill="#fff9f7" stroke="#9e6662" stroke-width="2"/><rect x="395" y="160" width="285" height="285" rx="70" fill="#d8e4ef" stroke="#718aa5" stroke-width="2"/><rect x="417" y="182" width="241" height="241" rx="58" fill="#f8fcff" stroke="#718aa5" stroke-width="2"/><path d="M420 265 Q475 300 530 320 M655 265 Q600 300 545 320" fill="none" stroke="#718aa5" stroke-width="8"/><rect x="795" y="160" width="80" height="285" rx="5" fill="#f2e3bd" stroke="#aa986e" stroke-width="2"/><rect x="803" y="160" width="64" height="285" rx="1" fill="#fffdf7" stroke="#aa986e" stroke-width="2"/><text x="55" y="495" font-family="sans-serif" font-size="21" fill="#173d36">Thick elastic wall</text><text x="400" y="495" font-family="sans-serif" font-size="21" fill="#173d36">Thinner wall + valve</text><text x="735" y="495" font-family="sans-serif" font-size="20" fill="#173d36">Thin exchange wall</text><text x="75" y="545" font-family="sans-serif" font-size="21" fill="#173d36">Schematic longitudinal sections; relative wall patterns, not exact sizes.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
