<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Embryo sac: cell identities and positions</title><desc id="desc">Typical angiosperm embryo-sac model before fusion of the polar nuclei: A egg and B two synergids at the lower micropylar end, C two polar nuclei in one central cell, D three antipodal cells at the upper chalazal end. Seven cells contain eight nuclei. One sperm fuses with the egg to form a 2n zygote; the second fuses with the central cell containing the two polar nuclei to form the usual 3n primary endosperm nucleus. Species variants exist.</desc><rect x="1" y="1" width="1098" height="718" rx="14" fill="#f7faf8" stroke="#173d36" stroke-width="2"/><text x="30" y="48" font-family="sans-serif" font-size="27" fill="#173d36">Embryo sac: cell identities and positions</text><path d="M215 350 a185 242 0 1 0 370 0 a185 242 0 1 0 -370 0" fill="#e6eee8" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 350 a142 207 0 1 0 284 0 a142 207 0 1 0 -284 0" fill="#fbf8ec" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M321 198 a24 28 0 1 0 48 0 a24 28 0 1 0 -48 0" fill="#dfcddc" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 198 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M376 180 a24 28 0 1 0 48 0 a24 28 0 1 0 -48 0" fill="#dfcddc" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 180 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M431 198 a24 28 0 1 0 48 0 a24 28 0 1 0 -48 0" fill="#dfcddc" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 198 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 504 a25 38 0 1 0 50 0 a25 38 0 1 0 -50 0" fill="#cbdde8" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 504 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 504 a25 38 0 1 0 50 0 a25 38 0 1 0 -50 0" fill="#cbdde8" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 504 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M374 502 a26 31 0 1 0 52 0 a26 31 0 1 0 -52 0" fill="#efd19c" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M394 502 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0" fill="#173d36" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M369 350 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0" fill="#c1d0b0" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M407 350 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0" fill="#c1d0b0" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="650" font-family="sans-serif" font-size="20" fill="#173d36">Micropyle end below; chalazal end above. Central cell contains two polar nuclei.</text><text x="650" y="160" font-family="sans-serif" font-size="22" fill="#173d36">D  Three antipodal cells</text><path d="M635 172 L477 198 M488.5094926729224 201.3958177825003 L477 198 L486.8144508244508 191.09517885717247" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="295" font-family="sans-serif" font-size="22" fill="#173d36">C  Two polar nuclei</text><path d="M635 306 L436 350 M447.6774099196866 352.76371083284863 L436 350 L445.42368347545926 342.5707207782749" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="435" font-family="sans-serif" font-size="22" fill="#173d36">B  Two synergids</text><path d="M635 445 L477 500 M488.92071303263896 501.3771713014259 L477 500 L485.488809389556 491.5182481085695" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="550" font-family="sans-serif" font-size="22" fill="#173d36">A  Egg cell</text><path d="M635 560 L414 515 M423.54665614517563 522.2705815754849 L414 515 L425.62953882021264 512.0413133269698" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="95" font-family="sans-serif" font-size="20" fill="#173d36">Typical model before polar-nuclear fusion</text><text x="30" y="693" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
