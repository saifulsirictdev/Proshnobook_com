<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Human reproduction: from gametes to implantation</title><desc id="desc">Functional flow diagram. An oocyte is released from the ovary and enters the oviduct, where fertilization normally creates the zygote. Cleavage produces a morula and then blastocyst while the developing conceptus travels to the uterus. Implantation occurs in the uterine endometrium. This is not an anatomical map, numerical timeline or clinical diagnostic diagram.</desc><rect x="1" y="1" width="1098" height="718" rx="14" fill="#f7faf8" stroke="#173d36" stroke-width="2"/><text x="30" y="48" font-family="sans-serif" font-size="27" fill="#173d36">Human reproduction: from gametes to implantation</text><text x="45" y="100" font-family="sans-serif" font-size="20" fill="#173d36">Functional sequence only: positions and distances are not anatomical.</text><rect x="50" y="145" width="240" height="105" rx="14" fill="#e5f0eb" stroke="#173d36" stroke-width="2"/><text x="70" y="205" font-family="sans-serif" font-size="22" fill="#173d36">Ovary: oocyte</text><rect x="400" y="145" width="590" height="105" rx="14" fill="#e5f0eb" stroke="#173d36" stroke-width="2"/><text x="420" y="205" font-family="sans-serif" font-size="22" fill="#173d36">Oviduct: sperm + oocyte → zygote</text><rect x="400" y="345" width="590" height="100" rx="14" fill="#e5f0eb" stroke="#173d36" stroke-width="2"/><text x="420" y="405" font-family="sans-serif" font-size="22" fill="#173d36">Cleavage → morula → blastocyst</text><rect x="400" y="535" width="590" height="100" rx="14" fill="#e5f0eb" stroke="#173d36" stroke-width="2"/><text x="420" y="595" font-family="sans-serif" font-size="22" fill="#173d36">Uterine lining: implantation</text><path d="M295 197 L390 197 M379.1946347717679 191.78041359066523 L390 197 L379.1946347717679 202.21958640933477" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 260 L700 330 M705.2195864093347 319.1946347717679 L700 330 L694.7804135906653 319.1946347717679" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 455 L700 520 M705.2195864093347 509.1946347717679 L700 520 L694.7804135906653 509.1946347717679" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="315" font-family="sans-serif" font-size="20" fill="#173d36">Ovulation releases</text><text x="50" y="347" font-family="sans-serif" font-size="20" fill="#173d36">the oocyte.</text><text x="50" y="470" font-family="sans-serif" font-size="20" fill="#173d36">Fertilization and</text><text x="50" y="502" font-family="sans-serif" font-size="20" fill="#173d36">implantation differ.</text><text x="30" y="693" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
