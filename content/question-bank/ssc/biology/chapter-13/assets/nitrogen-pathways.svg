<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Selected pathways in the nitrogen cycle</title><desc id="desc">Atmospheric nitrogen enters plant nutrition through fixing microbes. Plant remains yield ammonium, nitrification produces nitrite then nitrate, plants take up nitrate. Denitrification returns gaseous nitrogen. Simplified.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Selected pathways in the nitrogen cycle</text><text x="30" y="90" font-size="20" fill="#183449">Simplified nitrogen transformations; enrichment, not all processes</text><rect x="50" y="150" width="190" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="65" y="192.0" font-size="20" fill="#183449">Atmospheric N2</text><rect x="390" y="150" width="180" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="405" y="192.0" font-size="20" fill="#183449">Plant N</text><rect x="720" y="150" width="225" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="735" y="192.0" font-size="20" fill="#183449">Organic remains</text><rect x="720" y="405" width="225" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="735" y="447.0" font-size="20" fill="#183449">Ammonium</text><rect x="390" y="405" width="180" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="405" y="447.0" font-size="20" fill="#183449">Nitrite</text><rect x="50" y="405" width="190" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="65" y="447.0" font-size="20" fill="#183449">Nitrate</text><path d="M240 185 L390 185 M379.2 190.2 L390 185 L379.2 179.8" fill="none" stroke="#234e67" stroke-width="3"/><text x="255" y="145" font-size="18" fill="#183449">Fixation*</text><path d="M570 185 L720 185 M709.2 190.2 L720 185 L709.2 179.8" fill="none" stroke="#234e67" stroke-width="3"/><text x="585" y="165" font-size="17" fill="#183449">Death/waste</text><path d="M832 220 L832 405 M826.8 394.2 L832 405 L837.2 394.2" fill="none" stroke="#234e67" stroke-width="3"/><text x="640" y="310" font-size="18" fill="#183449">Ammonification</text><path d="M720 440 L570 440 M580.8 434.8 L570 440 L580.8 445.2" fill="none" stroke="#234e67" stroke-width="3"/><text x="580" y="410" font-size="17" fill="#183449">Nitrification</text><path d="M390 440 L240 440 M250.8 434.8 L240 440 L250.8 445.2" fill="none" stroke="#234e67" stroke-width="3"/><text x="250" y="410" font-size="17" fill="#183449">Nitrification</text><path d="M150 400 L430 225 M423.6 235.2 L430 225 L418.1 226.3" fill="none" stroke="#234e67" stroke-width="3"/><text x="235" y="310" font-size="18" fill="#183449">Uptake</text><path d="M95 400 L95 225 M100.2 235.8 L95 225 L89.8 235.8" fill="none" stroke="#234e67" stroke-width="3"/><text x="30" y="515" font-size="18" fill="#183449">Left upward arrow: denitrification</text><text x="30" y="560" font-size="19" fill="#183449">*Fixing microbes convert N2; fixed nitrogen can enter plant nutrition.</text><text x="30" y="600" font-size="19" fill="#183449">The N2-to-plant arrow summarises a microbial pathway, not direct</text><text x="30" y="630" font-size="19" fill="#183449">N2 absorption by most plants. Animal feeding steps are omitted.</text></g></svg>
