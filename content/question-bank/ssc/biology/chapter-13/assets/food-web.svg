<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">A small grassland food web</title><desc id="desc">Grass feeds grasshopper and mouse; grasshopper feeds frog; frog and mouse feed snake; mouse feeds owl. Arrows point toward consumers.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">A small grassland food web</text><text x="30" y="90" font-size="20" fill="#183449">Arrows: food to consumer; only the stated links are shown</text><rect x="40" y="300" width="160" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="55" y="339.5" font-size="20" fill="#183449">Grass</text><rect x="300" y="180" width="180" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="315" y="219.5" font-size="20" fill="#183449">Grasshopper</text><rect x="310" y="430" width="150" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="325" y="469.5" font-size="20" fill="#183449">Mouse</text><rect x="620" y="180" width="150" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="635" y="219.5" font-size="20" fill="#183449">Frog</text><rect x="820" y="300" width="150" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="835" y="339.5" font-size="20" fill="#183449">Snake</text><rect x="620" y="500" width="150" height="65" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="635" y="539.5" font-size="20" fill="#183449">Owl</text><path d="M200 315 L300 225 M295.5 236.1 L300 225 L288.5 228.3" fill="none" stroke="#234e67" stroke-width="3"/><path d="M200 350 L310 450 M298.5 446.6 L310 450 L305.5 438.9" fill="none" stroke="#234e67" stroke-width="3"/><path d="M480 212 L620 212 M609.2 217.2 L620 212 L609.2 206.8" fill="none" stroke="#234e67" stroke-width="3"/><path d="M770 220 L840 300 M829.0 295.3 L840 300 L836.8 288.4" fill="none" stroke="#234e67" stroke-width="3"/><path d="M460 450 L820 355 M810.9 362.8 L820 355 L808.2 352.7" fill="none" stroke="#234e67" stroke-width="3"/><path d="M460 475 L620 530 M608.1 531.4 L620 530 L611.5 521.6" fill="none" stroke="#234e67" stroke-width="3"/><text x="30" y="645" font-size="19" fill="#183449">Linked chains share resources; the diagram is not every possible link.</text></g></svg>
