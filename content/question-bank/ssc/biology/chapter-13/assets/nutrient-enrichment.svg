<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Nutrient enrichment and oxygen stress</title><desc id="desc">Excess nitrogen and phosphorus can promote algal growth. Dead organic matter and respiration can increase oxygen demand; oxygen may fall and stress fish. A possible pathway requiring measurement.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Nutrient enrichment and oxygen stress</text><text x="30" y="90" font-size="19" fill="#183449">A possible nutrient-enrichment pathway, not every cause of fish death</text><rect x="245" y="120" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="154.5" font-size="20" fill="#183449">Excess N / P input</text><path d="M500 177 L500 197 M494.8 186.2 L500 197 L505.2 186.2" fill="none" stroke="#234e67" stroke-width="3"/><rect x="245" y="200" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="234.5" font-size="20" fill="#183449">Algal overgrowth</text><path d="M500 257 L500 277 M494.8 266.2 L500 277 L505.2 266.2" fill="none" stroke="#234e67" stroke-width="3"/><rect x="245" y="280" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="314.5" font-size="20" fill="#183449">More organic remains</text><path d="M500 337 L500 357 M494.8 346.2 L500 357 L505.2 346.2" fill="none" stroke="#234e67" stroke-width="3"/><rect x="245" y="360" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="394.5" font-size="20" fill="#183449">Decomposition + respiration</text><path d="M500 417 L500 437 M494.8 426.2 L500 437 L505.2 426.2" fill="none" stroke="#234e67" stroke-width="3"/><rect x="245" y="440" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="474.5" font-size="20" fill="#183449">Dissolved oxygen can fall</text><path d="M500 497 L500 517 M494.8 506.2 L500 517 L505.2 506.2" fill="none" stroke="#234e67" stroke-width="3"/><rect x="245" y="520" width="520" height="55" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="260" y="554.5" font-size="20" fill="#183449">Fish may become stressed</text><text x="30" y="660" font-size="18" fill="#183449">Measure oxygen and other water-quality factors; reduce nutrient sources.</text></g></svg>
