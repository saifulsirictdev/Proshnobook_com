<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><title>ANAPHASE I OF MEIOSIS</title><desc>Two replicated homologues move apart, one toward each pole. Each retains two sister chromatids.</desc><rect width="900" height="520" rx="20" fill="#f3f8f6"/><g font-family="DejaVu Sans, sans-serif" fill="#193e34" font-size="20"><text x="30" y="40" font-size="25">ANAPHASE I OF MEIOSIS</text><text x="30" y="75" font-size="17">Starting cell: 2n = 2. Homologues separate; sisters stay joined.</text><rect x="100" y="110" width="700" height="300" rx="130" fill="#edf0df" stroke="#56826b" stroke-width="4"/><path d="M150 260 H305 M750 260 H595" stroke="#8faaa0" stroke-width="2"/><path d="M300 225 Q325 260 300 295 M340 225 Q315 260 340 295" fill="none" stroke="#be6855" stroke-width="9" stroke-linecap="round"/><path d="M314 260 H326" stroke="#193e34" stroke-width="8"/><path d="M560 225 Q585 260 560 295 M600 225 Q575 260 600 295" fill="none" stroke="#557db1" stroke-width="9" stroke-linecap="round"/><path d="M574 260 H586" stroke="#193e34" stroke-width="8"/><path d="M410 260 H360 L375 250 M360 260 L375 270 M490 260 H540 L525 250 M540 260 L525 270" stroke="#193e34" stroke-width="3" fill="none"/><text x="150" y="445">1 duplicated chromosome</text><text x="550" y="445">1 duplicated chromosome</text><text x="30" y="480" font-size="16">Original selected-structure schematic. Not to scale. Colours are identifiers only.</text></g></svg>
