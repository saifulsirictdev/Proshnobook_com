<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><title>MITOTIC METAPHASE</title><desc>Two replicated chromosomes align independently on the equator. Each has two sister chromatids. Four chromatids total.</desc><rect width="900" height="520" rx="20" fill="#f3f8f6"/><g font-family="DejaVu Sans, sans-serif" fill="#193e34" font-size="20"><text x="30" y="40" font-size="25">MITOTIC METAPHASE</text><text x="30" y="75" font-size="17">Starting cell: 2n = 2. Sister chromatids attach toward opposite poles.</text><rect x="100" y="110" width="700" height="300" rx="130" fill="#edf0df" stroke="#56826b" stroke-width="4"/><path d="M450 125 V395" stroke="#769084" stroke-dasharray="7 6" stroke-width="2"/><path d="M150 260 L440 200 M150 260 L440 320 M750 260 L460 200 M750 260 L460 320" stroke="#8faaa0" stroke-width="2"/><path d="M430 165 Q455 200 430 235 M470 165 Q445 200 470 235" fill="none" stroke="#be6855" stroke-width="9" stroke-linecap="round"/><path d="M444 200 H456" stroke="#193e34" stroke-width="8"/><path d="M430 285 Q455 320 430 355 M470 285 Q445 320 470 355" fill="none" stroke="#557db1" stroke-width="9" stroke-linecap="round"/><path d="M444 320 H456" stroke="#193e34" stroke-width="8"/><text x="330" y="445">2 chromosomes; 4 chromatids</text><text x="30" y="480" font-size="16">Original selected-structure schematic. Not to scale. Colours are identifiers only.</text></g></svg>
