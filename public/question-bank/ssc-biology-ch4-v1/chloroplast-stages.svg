<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Two linked systems in a chloroplast</title><desc id="desc">P labels a stack of thylakoids. Q labels stroma. ATP and NADPH go from light reactions to the Calvin cycle; ADP, Pi and NADP+ return. CO2 enters the cycle.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Two linked systems in a chloroplast</text><rect x="35" y="90" width="930" height="435" rx="65" fill="#e9f4dc" stroke="#69964c" stroke-width="2"/><text x="62" y="127" font-family="sans-serif" font-size="23" fill="#173d36">Chloroplast</text><rect x="85" y="205" width="265" height="215" rx="25" fill="#d3e9c6" stroke="#649d5c" stroke-width="2"/><rect x="115" y="230" width="200" height="20" rx="10" fill="#5b9c56" stroke="#316d3d" stroke-width="2"/><rect x="115" y="260" width="200" height="20" rx="10" fill="#5b9c56" stroke="#316d3d" stroke-width="2"/><rect x="115" y="290" width="200" height="20" rx="10" fill="#5b9c56" stroke="#316d3d" stroke-width="2"/><rect x="115" y="320" width="200" height="20" rx="10" fill="#5b9c56" stroke="#316d3d" stroke-width="2"/><text x="102" y="390" font-family="sans-serif" font-size="20" fill="#173d36">P: thylakoid stack</text><text x="650" y="180" font-family="sans-serif" font-size="24" fill="#173d36">Q: stroma</text><rect x="650" y="220" width="245" height="165" rx="25" fill="#fff2cc" stroke="#b69b49" stroke-width="2"/><text x="675" y="270" font-family="sans-serif" font-size="23" fill="#173d36">Calvin cycle</text><text x="675" y="310" font-family="sans-serif" font-size="21" fill="#173d36">CO2 fixation</text><text x="675" y="348" font-family="sans-serif" font-size="20" fill="#173d36">+ regeneration</text><path d="M350 255 L640 255 M629.19 260.22 L640 255 L629.19 249.78" fill="none" stroke="#173d36" stroke-width="3"/><text x="385" y="236" font-family="sans-serif" font-size="22" fill="#173d36">ATP + NADPH</text><path d="M650 355 L360 355 M370.81 349.78 L360 355 L370.81 360.22" fill="none" stroke="#173d36" stroke-width="3"/><text x="365" y="390" font-family="sans-serif" font-size="19" fill="#173d36">ADP + Pi + NADP+</text><text x="102" y="160" font-family="sans-serif" font-size="21" fill="#173d36">Light</text><path d="M160 170 L185 220 M175.50 212.67 L185 220 L184.84 208.00" fill="none" stroke="#bd8600" stroke-width="3"/><text x="650" y="440" font-family="sans-serif" font-size="21" fill="#173d36">CO2 in</text><path d="M695 425 L695 390 M700.22 400.81 L695 390 L689.78 400.81" fill="none" stroke="#173d36" stroke-width="3"/><path d="M895 300 L940 300 M929.19 305.22 L940 300 L929.19 294.78" fill="none" stroke="#173d36" stroke-width="3"/><text x="785" y="485" font-family="sans-serif" font-size="19" fill="#173d36">Organic products</text><text x="90" y="465" font-family="sans-serif" font-size="19" fill="#173d36">H2O split: electrons, H+, O2</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
