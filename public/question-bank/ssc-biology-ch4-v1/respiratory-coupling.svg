<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Respiratory energy coupling across the inner membrane</title><desc id="desc">Electron transport uses carrier electrons to pump H+ from the matrix to the intermembrane space. H+ returns through ATP synthase into the matrix, coupled to ATP formation. Oxygen is the final electron acceptor.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Respiratory energy coupling across the inner membrane</text><text x="50" y="100" font-family="sans-serif" font-size="23" fill="#173d36">Intermembrane space: higher H+ concentration</text><rect x="35" y="210" width="930" height="70" rx="4" fill="#d8e3f0" stroke="#7d96b0" stroke-width="2"/><text x="55" y="340" font-family="sans-serif" font-size="21" fill="#173d36">Matrix (lower H+)</text><rect x="235" y="180" width="300" height="130" rx="17" fill="#bcd8ef" stroke="#416b8a" stroke-width="2"/><text x="267" y="232" font-family="sans-serif" font-size="22" fill="#173d36">Electron transport</text><text x="290" y="270" font-family="sans-serif" font-size="20" fill="#173d36">and H+ pumping</text><rect x="725" y="170" width="170" height="150" rx="20" fill="#ffe4ac" stroke="#b88c32" stroke-width="2"/><text x="759" y="226" font-family="sans-serif" font-size="24" fill="#173d36">ATP</text><text x="744" y="266" font-family="sans-serif" font-size="23" fill="#173d36">synthase</text><path d="M385 180 L385 125 M390.22 135.81 L385 125 L379.78 135.81" fill="none" stroke="#416b8a" stroke-width="3"/><text x="405" y="145" font-family="sans-serif" font-size="19" fill="#173d36">H+ pumped out</text><path d="M810 120 L810 170 M804.78 159.19 L810 170 L815.22 159.19" fill="none" stroke="#b88c32" stroke-width="3"/><path d="M810 320 L810 375 M804.78 364.19 L810 375 L815.22 364.19" fill="none" stroke="#b88c32" stroke-width="3"/><text x="855" y="155" font-family="sans-serif" font-size="24" fill="#173d36">H+</text><text x="650" y="410" font-family="sans-serif" font-size="21" fill="#173d36">ADP + Pi</text><path d="M770 402 L830 402 M819.19 407.22 L830 402 L819.19 396.78" fill="none" stroke="#173d36" stroke-width="3"/><text x="845" y="410" font-family="sans-serif" font-size="23" fill="#173d36">ATP</text><text x="55" y="380" font-family="sans-serif" font-size="21" fill="#173d36">NADH / FADH2</text><path d="M250 375 L310 310 M306.51 321.48 L310 310 L298.84 314.40" fill="none" stroke="#173d36" stroke-width="3"/><text x="390" y="370" font-family="sans-serif" font-size="20" fill="#173d36">O2: final acceptor</text><text x="420" y="407" font-family="sans-serif" font-size="20" fill="#173d36">H2O formed</text><rect x="65" y="460" width="865" height="65" rx="10" fill="#e6f0e7" stroke="#91b29b" stroke-width="2"/><text x="88" y="500" font-family="sans-serif" font-size="25" fill="#173d36">Electron energy → proton gradient → ATP synthesis</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
