</g>
<g text-anchor="middle" font-size="22" font-weight="bold">
<text x="520" y="143">Order O</text>
<text x="350" y="249">Family F</text><text x="800" y="249">Family J</text>
<text x="230" y="367">Genus G</text><text x="505" y="367">Genus H</text><text x="800" y="367">Genus I</text>
<text x="165" y="485">Species X</text><text x="335" y="485">Species Y</text><text x="505" y="485">Species Z</text><text x="800" y="485">Species W</text>
</g>
<text x="40" y="550" font-size="17">Follow connections upward to find shared groups. One higher group may contain several lower groups.</text>
<text x="40" y="578" font-size="15" fill="#526f64">The question includes an equivalent written description for accessibility and plain-text use.</text>
</g></svg>
