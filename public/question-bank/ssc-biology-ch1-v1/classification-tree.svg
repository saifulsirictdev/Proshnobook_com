<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
<title id="title">Nested classification practice: order, family, genus and species</title>
<desc id="desc">Order O contains families F and J. Family F contains genera G and H. G contains species X and Y; H contains Z. Family J contains genus I, which contains species W. Letters are fictional group identifiers, not formal scientific names.</desc>
<rect width="1040" height="600" rx="18" fill="#f5f9f8"/>
<g font-family="sans-serif" fill="#173f36">
<text x="40" y="48" font-size="25" font-weight="bold">CLASSIFICATION: GROUPS WITHIN GROUPS</text>
<text x="40" y="79" font-size="16">Original practice diagram · fictional identifiers · not an evolutionary timescale</text>
<g fill="none" stroke="#60867b" stroke-width="3">
<path d="M520 159 V185 H350 V217 M520 185 H800 V217"/>
<path d="M350 265 V301 H230 V335 M350 301 H505 V335"/>
<path d="M800 265 V335"/>
