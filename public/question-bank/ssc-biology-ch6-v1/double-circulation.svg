<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Human double circulation: functional route map</title><desc id="desc">Body blood returns via venae cavae to right atrium, crosses tricuspid to right ventricle, and travels via pulmonary artery to lungs. Oxygen-rich blood returns via pulmonary veins to left atrium, crosses mitral to left ventricle and exits via aorta to body. This is a route map, not anatomical chamber positioning.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Human double circulation: functional route map</text><rect x="50" y="460" width="300" height="65" rx="12" fill="#e4e9e6" stroke="#173d36" stroke-width="2"/><text x="65" y="498" font-family="sans-serif" font-size="23" fill="#173d36">Body tissues</text><rect x="50" y="320" width="260" height="60" rx="12" fill="#dce9f5" stroke="#173d36" stroke-width="2"/><text x="65" y="358" font-family="sans-serif" font-size="23" fill="#173d36">Right atrium</text><rect x="50" y="180" width="260" height="60" rx="12" fill="#dce9f5" stroke="#173d36" stroke-width="2"/><text x="65" y="218" font-family="sans-serif" font-size="23" fill="#173d36">Right ventricle</text><rect x="370" y="85" width="260" height="65" rx="12" fill="#e1eddf" stroke="#173d36" stroke-width="2"/><text x="385" y="123" font-family="sans-serif" font-size="23" fill="#173d36">Lungs</text><rect x="690" y="180" width="260" height="60" rx="12" fill="#f5dede" stroke="#173d36" stroke-width="2"/><text x="705" y="218" font-family="sans-serif" font-size="23" fill="#173d36">Left atrium</text><rect x="690" y="320" width="260" height="60" rx="12" fill="#f5dede" stroke="#173d36" stroke-width="2"/><text x="705" y="358" font-family="sans-serif" font-size="23" fill="#173d36">Left ventricle</text><path d="M180 455 L180 385 M185.22 395.81 L180 385 L174.78 395.81" fill="none" stroke="#347cab" stroke-width="3"/><text x="205" y="425" font-family="sans-serif" font-size="18" fill="#173d36">Venae cavae</text><path d="M180 315 L180 245 M185.22 255.81 L180 245 L174.78 255.81" fill="none" stroke="#347cab" stroke-width="3"/><text x="205" y="285" font-family="sans-serif" font-size="18" fill="#173d36">Tricuspid</text><path d="M235 175 L365 120 M357.08 129.02 L365 120 L353.01 119.40" fill="none" stroke="#347cab" stroke-width="3"/><text x="40" y="105" font-family="sans-serif" font-size="18" fill="#173d36">Pulmonary artery</text><path d="M635 120 L760 175 M748.01 175.43 L760 175 L752.21 165.87" fill="none" stroke="#ba5960" stroke-width="3"/><text x="730" y="105" font-family="sans-serif" font-size="18" fill="#173d36">Pulmonary veins</text><path d="M815 245 L815 315 M809.78 304.19 L815 315 L820.22 304.19" fill="none" stroke="#ba5960" stroke-width="3"/><text x="840" y="285" font-family="sans-serif" font-size="18" fill="#173d36">Mitral</text><path d="M815 385 L815 495 L355 495" stroke="#ba5960" stroke-width="3" fill="none"/><path d="M470 495 L355 495 M365.81 489.78 L355 495 L365.81 500.22" fill="none" stroke="#ba5960" stroke-width="3"/><text x="580" y="475" font-family="sans-serif" font-size="22" fill="#173d36">Aorta</text><text x="350" y="270" font-family="sans-serif" font-size="21" fill="#173d36">Two separated sides</text><text x="355" y="305" font-family="sans-serif" font-size="20" fill="#173d36">and two linked circuits</text><text x="375" y="545" font-family="sans-serif" font-size="19" fill="#173d36">Blue: lower O2 | red: higher O2 (schematic)</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
