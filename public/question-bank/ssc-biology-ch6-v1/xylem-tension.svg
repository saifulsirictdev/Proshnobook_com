<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Water ascent: cohesion and tension</title><desc id="desc">Soil water enters the root and rises through a continuous xylem water column. Water evaporates from wet leaf surfaces and leaves as vapor. Leaf evaporation creates tension transmitted through cohesive water; adhesion and strong conduit walls help maintain the pathway.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Water ascent: cohesion and tension</text><rect x="65" y="440" width="300" height="75" rx="12" fill="#e4d8be" stroke="#9a8868" stroke-width="2"/><text x="90" y="485" font-family="sans-serif" font-size="23" fill="#173d36">Soil water → root</text><rect x="175" y="195" width="95" height="220" rx="12" fill="#d6e7ee" stroke="#577b8b" stroke-width="2"/><text x="325" y="300" font-family="sans-serif" font-size="24" fill="#173d36">Xylem water column</text><path d="M220 435 L220 365 M225.22 375.81 L220 365 L214.78 375.81" fill="none" stroke="#347cab" stroke-width="3"/><path d="M220 340 L220 240 M225.22 250.81 L220 240 L214.78 250.81" fill="none" stroke="#347cab" stroke-width="3"/><rect x="70" y="95" width="420" height="80" rx="12" fill="#dceccc" stroke="#69964c" stroke-width="2"/><text x="95" y="140" font-family="sans-serif" font-size="24" fill="#173d36">Wet leaf surfaces</text><path d="M220 195 L220 180 M225.22 190.81 L220 180 L214.78 190.81" fill="none" stroke="#347cab" stroke-width="3"/><path d="M495 130 L730 130 M719.19 135.22 L730 130 L719.19 124.78" fill="none" stroke="#347cab" stroke-width="3"/><text x="535" y="105" font-family="sans-serif" font-size="21" fill="#173d36">Water vapor</text><text x="750" y="138" font-family="sans-serif" font-size="24" fill="#173d36">Air</text><text x="550" y="235" font-family="sans-serif" font-size="23" fill="#173d36">Evaporation creates tension</text><path d="M505 240 L280 240 M290.81 234.78 L280 240 L290.81 245.22" fill="none" stroke="#173d36" stroke-width="3"/><text x="420" y="360" font-family="sans-serif" font-size="23" fill="#173d36">Cohesion: water ↔ water</text><text x="420" y="405" font-family="sans-serif" font-size="23" fill="#173d36">Adhesion: water ↔ wall</text><text x="60" y="550" font-family="sans-serif" font-size="22" fill="#173d36">Continuous water + strong conduit walls support upward flow.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
