<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Alveolar exchange: separate gradients</title><desc id="desc">Alveolar air and capillary blood stay separated by a thin moist barrier. Oxygen diffuses down its own partial-pressure gradient from alveolus into blood; carbon dioxide diffuses down its own gradient from blood into alveolus. Arrows cross the barrier; they do not represent blood flowing into an air sac. Layer thickness is exaggerated.</desc><rect x="1" y="1" width="998" height="598" rx="18" fill="#f4faf7" stroke="#b2cbbf" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Alveolar exchange: separate gradients</text><rect x="90" y="110" width="820" height="150" rx="35" fill="#e4eddd" stroke="#7c9570" stroke-width="2"/><text x="125" y="155" font-family="sans-serif" font-size="25" fill="#173d36">ALVEOLAR AIR</text><text x="125" y="200" font-family="sans-serif" font-size="21" fill="#173d36">O2 pressure higher than incoming blood</text><rect x="90" y="285" width="820" height="20" rx="2" fill="#f4e4bf" stroke="#a28d5c" stroke-width="2"/><text x="100" y="88" font-family="sans-serif" font-size="20" fill="#173d36">Thin moist air–blood barrier (exaggerated thickness)</text><rect x="90" y="365" width="820" height="120" rx="25" fill="#e5e9f4" stroke="#7987a5" stroke-width="2"/><text x="110" y="465" font-family="sans-serif" font-size="23" fill="#173d36">CAPILLARY BLOOD</text><path d="M325 215 L325 425 M319.78 414.19 L325 425 L330.22 414.19" fill="none" stroke="#a84f54" stroke-width="3"/><text x="350" y="390" font-family="sans-serif" font-size="21" fill="#173d36">O2 → blood</text><path d="M690 425 L690 220 M695.22 230.81 L690 220 L684.78 230.81" fill="none" stroke="#3b7da6" stroke-width="3"/><text x="705" y="250" font-family="sans-serif" font-size="21" fill="#173d36">CO2 → air</text><text x="110" y="530" font-family="sans-serif" font-size="20" fill="#173d36">CO2 pressure is higher in incoming blood than in alveolar air.</text><text x="30" y="575" font-family="sans-serif" font-size="17" fill="#506b63">Original editorial schematic | not to scale | review draft</text></svg>
