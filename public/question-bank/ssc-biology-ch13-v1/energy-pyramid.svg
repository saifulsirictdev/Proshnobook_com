<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Energy through four trophic levels</title><desc id="desc">Grass 100000 kilojoules, grasshopper 10000, frog 1000, snake 100 under an assumed ten percent transfer at every step. Widths are not to scale.</desc><rect width="1000" height="700" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="27" fill="#183449">Energy through four trophic levels</text><text x="30" y="90" font-size="20" fill="#183449">Illustrative 10% transfer model; not a universal measured rate</text><rect x="365" y="145" width="270" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="380" y="187.0" font-size="20" fill="#183449">Snake: 100 kJ</text><rect x="280" y="245" width="440" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="295" y="287.0" font-size="20" fill="#183449">Frog: 1,000 kJ</text><rect x="195" y="345" width="610" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="210" y="387.0" font-size="20" fill="#183449">Grasshopper: 10,000 kJ</text><rect x="110" y="445" width="780" height="70" rx="8" fill="#edf6f2" stroke="#35614f" stroke-width="2"/><text x="125" y="487.0" font-size="20" fill="#183449">Grass: 100,000 kJ</text><path d="M500 240 L500 220 M505.2 230.8 L500 220 L494.8 230.8" fill="none" stroke="#234e67" stroke-width="3"/><path d="M500 340 L500 320 M505.2 330.8 L500 320 L494.8 330.8" fill="none" stroke="#234e67" stroke-width="3"/><path d="M500 440 L500 420 M505.2 430.8 L500 420 L494.8 430.8" fill="none" stroke="#234e67" stroke-width="3"/><text x="35" y="565" font-size="20" fill="#183449">Three transfers from grass to snake: 100,000 x 0.1 x 0.1 x 0.1</text><text x="35" y="605" font-size="20" fill="#183449">Other paths include uneaten matter, waste and respiratory heat.</text><text x="35" y="650" font-size="19" fill="#183449">Box width is illustrative, not an exact area or biomass scale.</text></g></svg>
