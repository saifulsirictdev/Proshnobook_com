<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Placenta: exchange between separate circulations</title><desc id="desc">Functional model of placental exchange, not a histological section. Maternal and fetal blood occupy distinct compartments separated by an exchange surface. Oxygen and nutrients move toward the fetus; fetal carbon dioxide and some metabolic wastes move toward the mother. Cord vessels belong to the fetal circulation. Arrows represent selected substances, not direct mixing of the blood streams. Placenta also produces hormones and is not an absolute barrier to medicines or infections.</desc><rect x="1" y="1" width="1098" height="718" rx="14" fill="#f7faf8" stroke="#173d36" stroke-width="2"/><text x="30" y="48" font-family="sans-serif" font-size="27" fill="#173d36">Placenta: exchange between separate circulations</text><rect x="45" y="120" width="400" height="450" rx="14" fill="#f4dce1" stroke="#173d36" stroke-width="2"/><rect x="655" y="120" width="400" height="450" rx="14" fill="#dce8f4" stroke="#173d36" stroke-width="2"/><rect x="475" y="140" width="150" height="410" rx="14" fill="#e6eadf" stroke="#173d36" stroke-width="2"/><text x="70" y="160" font-family="sans-serif" font-size="25" fill="#173d36">Maternal blood</text><text x="680" y="160" font-family="sans-serif" font-size="25" fill="#173d36">Fetal blood</text><text x="487" y="195" font-family="sans-serif" font-size="20" fill="#173d36">Exchange</text><text x="487" y="225" font-family="sans-serif" font-size="20" fill="#173d36">surface</text><text x="85" y="250" font-family="sans-serif" font-size="22" fill="#173d36">Oxygen + nutrients</text><path d="M240 285 L840 285 M829.1946347717678 279.78041359066526 L840 285 L829.1946347717678 290.21958640933474" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="380" font-family="sans-serif" font-size="22" fill="#173d36">CO2 + wastes</text><path d="M840 420 L240 420 M250.80536522823212 425.21958640933474 L240 420 L250.80536522823212 414.78041359066526" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="510" font-family="sans-serif" font-size="20" fill="#173d36">Maternal circulation</text><text x="680" y="510" font-family="sans-serif" font-size="20" fill="#173d36">Cord vessels connect</text><text x="680" y="540" font-family="sans-serif" font-size="20" fill="#173d36">fetus and placenta</text><text x="65" y="620" font-family="sans-serif" font-size="21" fill="#173d36">Separate circulations: substances cross; blood does not normally mix directly.</text><text x="30" y="693" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
