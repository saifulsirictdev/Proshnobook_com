<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Flower: reproductive structures in section</title><desc id="desc">A stigma above the style; B anthers on filaments outside C ovary; D ovules within the ovary. Petals and sepals surround the reproductive structures, all supported by the receptacle. This is a generalized section, not a species-identification drawing. Ovules become seeds, whereas the ovary wall contributes the pericarp.</desc><rect x="1" y="1" width="1098" height="718" rx="14" fill="#f7faf8" stroke="#173d36" stroke-width="2"/><text x="30" y="48" font-family="sans-serif" font-size="27" fill="#173d36">Flower: reproductive structures in section</text><path d="M450 490 Q225 470 185 235 Q320 220 438 420" fill="#f3dbe4" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 490 Q725 470 765 235 Q630 220 512 420" fill="#f3dbe4" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 510 Q335 560 265 495 Q355 475 445 485" fill="#c9dfc8" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 510 Q620 560 690 495 Q600 475 505 485" fill="#c9dfc8" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="453" y="510" width="44" height="115" rx="14" fill="#d5dfc8" stroke="#173d36" stroke-width="2"/><path d="M438 340 L438 173 Q413 163 428 145 Q475 130 522 145 Q537 163 512 173 L512 340 Q570 375 550 458 Q535 515 475 515 Q415 515 400 458 Q380 375 438 340 Z" fill="#d4e4db" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M423 407 a15 23 0 1 0 30 0 a15 23 0 1 0 -30 0" fill="#f8f2d3" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 420 a15 23 0 1 0 30 0 a15 23 0 1 0 -30 0" fill="#f8f2d3" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 460 a15 23 0 1 0 30 0 a15 23 0 1 0 -30 0" fill="#f8f2d3" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 470 L320 265" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 250 a35 18 0 1 0 70 0 a35 18 0 1 0 -70 0" fill="#e7ca86" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 470 L625 265" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 250 a35 18 0 1 0 70 0 a35 18 0 1 0 -70 0" fill="#e7ca86" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="130" font-family="sans-serif" font-size="22" fill="#173d36">A  Stigma</text><path d="M665 137 L520 155 M531.3660718384416 158.8486895124684 L520 155 L530.0800456167734 148.4890338379187" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="160" font-family="sans-serif" font-size="22" fill="#173d36">B  Anther</text><path d="M170 170 L301 246 M294.2729180970233 236.06287923638627 L301 246 L289.03436473337985 245.09249095529802" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="365" font-family="sans-serif" font-size="22" fill="#173d36">C  Ovary</text><path d="M790 375 L553 390 M564.1134820279839 394.5266452493739 L553 390 L563.4540942449637 384.1083182776547" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="465" font-family="sans-serif" font-size="22" fill="#173d36">D  Ovule</text><path d="M790 470 L510 427 M519.887866735907 433.7992713883875 L510 427 L521.4724487723558 423.48106277895283" fill="none" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="590" font-family="sans-serif" font-size="22" fill="#173d36