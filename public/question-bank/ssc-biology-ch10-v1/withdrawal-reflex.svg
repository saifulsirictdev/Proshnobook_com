<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Withdrawal reflex: input, integration, output</title><desc id="desc">Functional flow map, not a spinal-cord anatomical cross-section. Blue arrow carries sensory information from skin receptor into spinal integration. Relay circuit leads to motor output; red arrow carries the efferent signal to muscle effector. A branch carries information toward the brain. Only a selected withdrawal pathway is shown; brain modulation, multiple muscles and reciprocal inhibition are omitted. Not all reflexes are spinal or polysynaptic. No heat or needle testing is needed.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Withdrawal reflex: input, integration, output</text><rect x="365" y="115" width="380" height="420" rx="12" fill="#dde8e4" stroke="#173d36" stroke-width="2"/><text x="410" y="155" font-family="sans-serif" font-size="23" fill="#173d36">Spinal integration</text><rect x="45" y="195" width="230" height="75" rx="12" fill="#d4e8f1" stroke="#173d36" stroke-width="2"/><text x="63" y="239" font-family="sans-serif" font-size="22" fill="#173d36">Skin receptor</text><rect x="815" y="420" width="230" height="75" rx="12" fill="#efd4ce" stroke="#173d36" stroke-width="2"/><text x="833" y="464" font-family="sans-serif" font-size="22" fill="#173d36">Muscle effector</text><path d="M275 232 L425 232 M415.0950818741206 227.21537912477646 L425 232 L415.0950818741206 236.78462087522354" stroke="#4084a0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="320" font-family="sans-serif" font-size="22" fill="#4084a0">Sensory / afferent</text><rect x="425" y="205" width="240" height="65" rx="12" fill="#bcdce7" stroke="#173d36" stroke-width="2"/><text x="451" y="245" font-family="sans-serif" font-size="21" fill="#173d36">Sensory input</text><path d="M545 275 L545 330 M549.7846208752235 320.0950818741206 L545 330 L540.2153791247765 320.0950818741206" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="425" y="335" width="240" height="65" rx="12" fill="#dbd8ea" stroke="#173d36" stroke-width="2"/><text x="454" y="375" font-family="sans-serif" font-size="21" fill="#173d36">Relay circuit</text><path d="M545 405 L545 450 M549.7846208752235 440.0950818741206 L545 450 L540.2153791247765 440.0950818741206" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="425" y="455" width="240" height="65" rx="12" fill="#e6bfb5" stroke="#173d36" stroke-width="2"/><text x="453" y="495" font-family="sans-serif" font-size="21" fill="#173d36">Motor output</text><path d="M670 485 L810 460 M799.4082339051727 457.03107915355315 L810 460 L801.0904170222883 466.45130460940027" stroke="#ad6b5e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="780" y="550" font-family="sans-serif" font-size="22" fill="#ad6b5e">Efferent pathway</text><path d="M685 220 L900 130 M889.015773177753 129.41113573938466 L900 130 L892.7108218920874 138.2381965569612" stroke="#4084a0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="780" y="95" font-family="sans-serif" font-size="21" fill="#173d36">Information to brain</text><text x="65" y="595" font-family="sans-serif" font-size="21" fill="#173d36">Withdrawal model: local response can begin before conscious decision.</text><text x="65" y="625" font-family="sans-serif" font-size="21" fill="#173d36">Some reflexes use brainstem; not all require this relay pattern.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
