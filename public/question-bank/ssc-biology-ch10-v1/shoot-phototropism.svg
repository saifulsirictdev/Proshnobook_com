<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Shoot phototropism: unequal growth produces bending</title><desc id="desc">Light arrives from viewer left. The shoot bends toward the light, while the shaded right-hand side is on the outside of the bend and elongates more in this simplified auxin model. The tip detects light; the response occurs in the elongation zone below it. The base is fixed. This is a selected shoot mechanism, not a claim about every organ, auxin dose or plant species.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Shoot phototropism: unequal growth produces bending</text><text x="55" y="115" font-family="sans-serif" font-size="24" fill="#173d36">Light from left</text><path d="M110 170 L240 170 M230.09508187412055 165.21537912477646 L240 170 L230.09508187412055 174.78462087522354" stroke="#bb8b25" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 250 L300 250 M290.0950818741206 245.21537912477646 L300 250 L290.0950818741206 254.78462087522354" stroke="#bb8b25" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="480" width="260" height="110" rx="12" fill="#d7e9db" stroke="#173d36" stroke-width="2"/><path d="M400 480 C395 355 335 245 255 195 L280 165 C365 225 445 350 450 480 Z" stroke="#477f61" stroke-width="4" fill="#cae5ce" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="155" font-family="sans-serif" font-size="22" fill="#173d36">Tip detects light direction</text><path d="M500 165 L278 180 M288.20493516289116 184.1060075890319 L278 180 L287.5598356584323 174.55853492304084" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="260" font-family="sans-serif" font-size="23" fill="#173d36">Shaded side:</text><text x="530" y="295" font-family="sans-serif" font-size="21" fill="#173d36">more auxin in this shoot model</text><path d="M520 300 L395 320 M405.53644326298365 323.1596460823843 L395 320 L404.0245939636196 313.7105879613591" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="380" font-family="sans-serif" font-size="21" fill="#173d36">More elongation on shaded side</text><text x="530" y="415" font-family="sans-serif" font-size="22" fill="#173d36">→ shoot bends toward light</text><text x="70" y="620" font-family="sans-serif" font-size="20" fill="#173d36">Written model only: root response and dose sensitivity differ; no chemical recipe.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
