<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Major CNS regions: selected side-view outline</title><desc id="desc">An original simplified lateral regional map with front to viewer left. Cerebrum is the large upper mass; cerebellum is the small posterior lower mass; brainstem is the descending connection to spinal cord. Pons and medulla are not separately resolved. This outline distinguishes regions and continuity, not detailed anatomy, internal nuclei or exact localization of every function. Hypothalamus and pituitary are deliberately not plotted on this lateral outline.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Major CNS regions: selected side-view outline</text><path d="M250 355 Q165 275 230 180 Q265 105 390 130 Q485 90 565 155 Q675 190 635 305 Q610 380 510 365 L350 375 Z" stroke="#173d36" stroke-width="4" fill="#cddfda" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 365 Q550 355 590 400 L570 445 Q505 438 495 400 Z" stroke="#173d36" stroke-width="3" fill="#b9cedf" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 330 L480 420 L500 450 L480 500 L450 550 L422 535 L451 477 L455 440 L438 410 L478 323 Z" stroke="#173d36" stroke-width="3" fill="#dfcbb8" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 225 Q300 180 340 225 Q370 175 410 215" stroke="#5f8d7c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 285 Q355 245 400 285 Q445 245 485 275" stroke="#5f8d7c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 165 Q505 185 505 225" stroke="#5f8d7c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555 220 Q605 250 570 300" stroke="#5f8d7c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="160" font-family="sans-serif" font-size="24" fill="#173d36">Cerebrum</text><path d="M705 170 L580 210 M590.8919195052821 211.5382098330385 L580 210 L587.9754468929576 202.4242329195248" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="275" font-family="sans-serif" font-size="24" fill="#173d36">Cerebellum</text><path d="M705 285 L567 404 M577.6257445560566 401.15508301888565 L567 404 L571.3765687093795 393.90813960004994" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="390" font-family="sans-serif" font-size="24" fill="#173d36">Brainstem</text><path d="M705 400 L486 432 M496.49262010569254 435.3022603346218 L486 432 L495.10906663368036 425.83356626053836" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="495" font-family="sans-serif" font-size="24" fill="#173d36">Spinal cord</text><path d="M705 500 L465 521 M475.28427801925807 524.9030277506835 L465 521 L474.4501563993709 515.3702092376866" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="585" font-family="sans-serif" font-size="21" fill="#173d36">Brainstem = midbrain + pons + medulla; functions work in networks.</text><text x="70" y="620" font-family="sans-serif" font-size="21" fill="#173d36">Regional side-view outline only; not a surgical section or scale map.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
