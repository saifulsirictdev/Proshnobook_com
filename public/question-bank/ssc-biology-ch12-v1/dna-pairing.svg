<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">DNA: base pairing and strand direction</title><desc id="desc">A pairs T with two hydrogen bonds. G pairs C with three. Left strand 5 prime to 3 prime downward; right strand opposite.</desc><rect width="900" height="570" fill="#ffffff"/><g font-family="sans-serif"><text x="30" y="38" font-size="24" fill="#142d41">DNA: base pairing and strand direction</text><text x="40" y="78" font-size="18" fill="#142d41">Antiparallel strands; flat teaching model, not a helix to scale</text><path d="M270 135 V465 M570 135 V465" fill="none" stroke="#27485d" stroke-width="7"/><text x="245" y="115" font-size="19" fill="#142d41">5&#x27;</text><text x="555" y="115" font-size="19" fill="#142d41">3&#x27;</text><text x="245" y="503" font-size="19" fill="#142d41">3&#x27;</text><text x="555" y="503" font-size="19" fill="#142d41">5&#x27;</text><rect x="295" y="140" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><rect x="455" y="140" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="327" y="173" font-size="26" fill="#142d41">A</text><text x="487" y="173" font-size="26" fill="#142d41">T</text><path d="M385 161 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 171 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><rect x="295" y="220" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><rect x="455" y="220" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="327" y="253" font-size="26" fill="#142d41">T</text><text x="487" y="253" font-size="26" fill="#142d41">A</text><path d="M385 241 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 251 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><rect x="295" y="300" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><rect x="455" y="300" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="327" y="333" font-size="26" fill="#142d41">G</text><text x="487" y="333" font-size="26" fill="#142d41">C</text><path d="M385 317 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 326 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 335 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><rect x="295" y="380" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><rect x="455" y="380" width="90" height="50" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="327" y="413" font-size="26" fill="#142d41">C</text><text x="487" y="413" font-size="26" fill="#142d41">G</text><path d="M385 397 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 406 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><path d="M385 415 H455" fill="none" stroke="#9c5c28" stroke-width="2"/><text x="35" y="540" font-size="18" fill="#142d41">Outer rails: sugar-phosphate | Inner rungs: paired bases | Lines: H-bonds</text></g></svg>
