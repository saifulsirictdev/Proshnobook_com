<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">Monohybrid probability grid</title><desc id="desc">T and t gametes from each Tt parent combine as TT,Tt,Tt,tt. Independent events; not a birth-order schedule.</desc><rect width="900" height="570" fill="#ffffff"/><g font-family="sans-serif"><text x="30" y="38" font-size="24" fill="#142d41">Monohybrid probability grid</text><text x="35" y="80" font-size="18" fill="#142d41">Parents Tt x Tt; complete dominance; equally likely gametes</text><text x="365" y="135" font-size="28" fill="#142d41">T</text><text x="575" y="135" font-size="28" fill="#142d41">t</text><text x="215" y="225" font-size="28" fill="#142d41">T</text><text x="215" y="375" font-size="28" fill="#142d41">t</text><rect x="300" y="165" width="200" height="140" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="372" y="242" font-size="32" fill="#142d41">TT</text><rect x="510" y="165" width="200" height="140" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="582" y="242" font-size="32" fill="#142d41">Tt</text><rect x="300" y="315" width="200" height="140" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="372" y="392" font-size="32" fill="#142d41">Tt</text><rect x="510" y="315" width="200" height="140" rx="6" fill="#eaf4f8" stroke="#456479"/><text x="582" y="392" font-size="32" fill="#142d41">tt</text><text x="45" y="500" font-size="20" fill="#142d41">Genotype 1 : 2 : 1 | Phenotype 3 : 1 (under stated assumptions)</text><text x="45" y="538" font-size="19" fill="#142d41">Four cells are possibilities, not four compulsory births.</text></g></svg>
