<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">Semiconservative replication: follow the strands</title><desc id="desc">One double strand becomes two then four molecules. O1 and O2 stay intact in separate descendants. N1 and N2 become templates in cycle two. Dashed style marks all nonoriginal strands.</desc><rect width="900" height="570" fill="#ffffff"/><g font-family="sans-serif"><text x="30" y="38" font-size="24" fill="#142d41">Semiconservative replication: follow the strands</text><text x="35" y="80" font-size="18" fill="#142d41">Solid dark = original labeled strand; dashed = all nonoriginal strands</text><text x="35" y="128" font-size="19" fill="#142d41">Start: 1 DNA</text><text x="335" y="128" font-size="19" fill="#142d41">Cycle 1: 2 DNA</text><text x="635" y="128" font-size="19" fill="#142d41">Cycle 2: 4 DNA</text><path d="M40 285 h160" stroke="#183c55" stroke-width="5"/><text x="214" y="291" font-size="16" fill="#142d41">O1</text><path d="M40 305 h160" stroke="#183c55" stroke-width="5"/><text x="214" y="311" font-size="16" fill="#142d41">O2</text><path d="M335 220 h160" stroke="#183c55" stroke-width="5"/><text x="509" y="226" font-size="16" fill="#142d41">O1</text><path d="M335 240 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="509" y="246" font-size="16" fill="#142d41">N1</text><path d="M335 380 h160" stroke="#183c55" stroke-width="5"/><text x="509" y="386" font-size="16" fill="#142d41">O2</text><path d="M335 400 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="509" y="406" font-size="16" fill="#142d41">N2</text><path d="M635 180 h160" stroke="#183c55" stroke-width="5"/><text x="809" y="186" font-size="16" fill="#142d41">O1</text><path d="M635 200 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="206" font-size="16" fill="#142d41">new</text><path d="M635 260 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="266" font-size="16" fill="#142d41">N1</text><path d="M635 280 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="286" font-size="16" fill="#142d41">new</text><path d="M635 360 h160" stroke="#183c55" stroke-width="5"/><text x="809" y="366" font-size="16" fill="#142d41">O2</text><path d="M635 380 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="386" font-size="16" fill="#142d41">new</text><path d="M635 440 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="446" font-size="16" fill="#142d41">N2</text><path d="M635 460 h160" stroke="#9b5c2e" stroke-width="5" stroke-dasharray="9 5"/><text x="809" y="466" font-size="16" fill="#142d41">new</text><path d="M275 290 L315 220 M275 310 L315 380 M570 220 L615 180 M570 240 L615 260 M570 380 L615 360 M570 400 L615 440" fill="none" stroke="#27485d" stroke-width="2"/><text x="30" y="520" font-size="19" fill="#142d41">Each daughter retains one template from its immediate parent.</text><text x="30" y="550" font-size="18" fill="#142d41">After two cycles, only two molecules contain the original O1/O2 labels.</text></g></svg>
