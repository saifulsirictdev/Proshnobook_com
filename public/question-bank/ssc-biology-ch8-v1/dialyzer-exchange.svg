<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Hemodialyzer: exchange without bulk mixing</title><desc id="desc">An expanded hollow-fiber wall separates blood from dialysate; this is not an access or assembly diagram. Blood and dialysate flow in opposite directions. Urea crosses the intact selective membrane down its concentration gradient while cells and most large proteins stay in blood. Controlled excess water removal uses pressure; safe composition and monitoring are clinical tasks. Channel shapes and layer thickness are not to scale.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Hemodialyzer: exchange without bulk mixing</text><rect x="70" y="155" width="930" height="120" rx="12" fill="#eed7d9" stroke="#173d36" stroke-width="2"/><text x="95" y="195" font-family="sans-serif" font-size="23" fill="#173d36">BLOOD inside hollow fibers (one expanded channel)</text><text x="95" y="220" font-family="sans-serif" font-size="20" fill="#173d36">Cells / most large proteins retained in blood</text><path d="M135 240 L930 240 M920.0950818741205 235.21537912477646 L930 240 L920.0950818741205 244.78462087522354" stroke="#b95361" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="395" width="930" height="135" rx="12" fill="#d9e9ef" stroke="#173d36" stroke-width="2"/><text x="95" y="500" font-family="sans-serif" font-size="23" fill="#173d36">DIALYSATE outside fibers — separate circuit</text><path d="M930 435 L135 435 M144.90491812587945 439.78462087522354 L135 435 L144.90491812587945 430.21537912477646" stroke="#3b7da6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="305" width="930" height="45" rx="12" fill="#ede2c4" stroke="#173d36" stroke-width="2"/><text x="90" y="335" font-family="sans-serif" font-size="22" fill="#173d36">Selective membrane (enlarged)</text><path d="M710 260 L710 415 M714.7846208752235 405.0950818741206 L710 415 L705.2153791247765 405.0950818741206" stroke="#67794d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="382" font-family="sans-serif" font-size="23" fill="#173d36">Urea</text><text x="85" y="110" font-family="sans-serif" font-size="23" fill="#173d36">Higher blood urea → lower dialysate urea: diffusion down a gradient</text><text x="85" y="580" font-family="sans-serif" font-size="23" fill="#173d36">Excess fluid removal is controlled separately by pressure (ultrafiltration).</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
