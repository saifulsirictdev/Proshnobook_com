<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Kidney section: regions and drainage</title><desc id="desc">A is cortex beneath the renal capsule. B is medulla with stylized pyramids. Pyramid tips (papillae) drain via branching minor and major calyces to C, the renal pelvis, then ureter. Blood vessels are omitted to emphasize urine drainage. Calyces and tissue boundaries are simplified, not to scale.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Kidney section: regions and drainage</text><path d="M520 115 C390 55 210 125 200 320 C190 520 355 595 520 530 C595 500 595 420 510 390 C445 365 445 275 510 250 C595 220 595 150 520 115" stroke="#9c666a" stroke-width="4" fill="#edd1cd" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 155 C370 105 245 170 240 320 C235 470 360 545 495 493 C530 475 530 440 480 420 C385 375 385 260 480 220 C530 200 530 170 495 155" stroke="#b6887f" stroke-width="2" fill="#f7e6d4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 235 L370 190 L405 280 Z" stroke="#a06c64" stroke-width="2" fill="#d59c89" stroke-linecap="round" stroke-linejoin="round"/><path d="M263 290 L263 370 L380 330 Z" stroke="#a06c64" stroke-width="2" fill="#d59c89" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 420 L365 478 L410 395 Z" stroke="#a06c64" stroke-width="2" fill="#d59c89" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 280 L455 305 L490 330 M380 330 L490 330 M410 395 L455 355 L490 330" stroke="#ad9146" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 300 Q530 285 562 320 L575 345 L542 385 Q515 365 485 360 Z" stroke="#ad9146" stroke-width="2" fill="#ead69b" stroke-linecap="round" stroke-linejoin="round"/><path d="M551 365 Q595 410 585 540" stroke="#ad9146" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 470 L585 520 M589.7846208752235 510.0950818741206 L585 520 L580.2153791247765 510.0950818741206" stroke="#856a2d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="125" font-family="sans-serif" font-size="22" fill="#173d36">Renal capsule</text><path d="M195 135 L237 200 M235.64313136355477 189.08400680178704 L237 200 L227.60576571248106 194.27738153017316" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="145" font-family="sans-serif" font-size="24" fill="#173d36">A  Cortex</text><path d="M640 150 L545 170 M555.6781375505366 172.64147278082137 L545 170 L553.7067734542447 163.27749332343518" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="220" font-family="sans-serif" font-size="23" fill="#173d36">B  Medulla: pyramids</text><path d="M640 225 L320 254 M330.2963295368132 257.87112361845357 L320 254 L329.43265637751193 248.34093703306073" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="305" font-family="sans-serif" font-size="22" fill="#173d36">Calyces (branched cups)</text><path d="M640 312 L454 306 M463.7455063326103 311.1014807968915 L454 306 L464.0540310693484 301.5372139580104" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="390" font-family="sans-serif" font-size="24" fill="#173d36">C  Renal pelvis</text><path d="M640 380 L530 345 M537.9879372830197 352.5625959803855 L530 345 L540.8893663791225 343.44381882120524" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="490" font-family="sans-serif" font-size="23" fill="#173d36">Ureter → bladder</text><path d="M640 480 L588 452 M594.452606246699 460.90864033537446 L588 452 L598.9893820671653 452.4831995259371" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="592" font-family="sans-serif" font-size="23" fill="#173d36">Papilla → minor / major calyces → pelvis → ureter</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
