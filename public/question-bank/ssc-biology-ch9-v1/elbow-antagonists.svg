<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Elbow flexion: an antagonistic muscle model</title><desc id="desc">Simplified functional side view with flexed elbow. The biceps is shown as the flexor transmitting pull by a tendon toward the radius; the triceps is shown less active in this simple action and links posteriorly toward the ulna. The red curved arrow indicates flexion. For active extension the triceps is the principal extensor. Bone lengths, attachment geometry and muscle shapes are schematic; other flexors, co-contraction and full joint anatomy are omitted. Muscles pull, not actively push bones.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Elbow flexion: an antagonistic muscle model</text><path d="M340 125 L370 435" stroke="#9e886f" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M385 450 L715 450 M385 478 L710 478" stroke="#9e886f" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 435 Q375 420 395 442 L395 480 Q370 499 352 473 Z" stroke="#173d36" stroke-width="3" fill="#e2d0b7" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 165 C415 195 442 300 390 365 L355 210 Z" stroke="#aa4b58" stroke-width="3" fill="#d98b91" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 365 L450 442" stroke="#aa4b58" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 160 C270 225 285 335 335 385 L325 220 Z" stroke="#527da4" stroke-width="3" fill="#c1d5e6" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 385 L355 475" stroke="#527da4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="155" font-family="sans-serif" font-size="23" fill="#173d36">Humerus</text><path d="M520 165 L350 210 M360.7994850197316 212.09072315445945 L350 210 L358.35078724792425 202.84008712763165" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="255" font-family="sans-serif" font-size="23" fill="#aa4b58">Biceps: flexor pull</text><path d="M520 265 L406 280 M416.44444900701654 283.4515916531118 L406 280 L415.1960982387842 273.964125814546" stroke="#aa4b58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="280" font-family="sans-serif" font-size="22" fill="#527da4">Triceps</text><text x="50" y="310" font-family="sans-serif" font-size="20" fill="#527da4">less active in</text><text x="50" y="338" font-family="sans-serif" font-size="20" fill="#527da4">this simple flexion</text><path d="M235 310 L292 290 M281.06959025010354 288.76462851766416 L292 290 L284.23784861668145 297.79416486241126" stroke="#527da4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="380" font-family="sans-serif" font-size="21" fill="#173d36">Tendon</text><path d="M530 385 L432 421 M442.9472679453306 422.07579019010973 L432 421 L439.64762628517366 413.0934323374601" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="520" font-family="sans-serif" font-size="23" fill="#173d36">Forearm: radius / ulna</text><path d="M555 495 L570 475 M560.2293524242936 480.0531619755694 L570 475 L567.8847458246512 485.7947070258377" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M715 420 Q700 345 635 320" stroke="#aa4b58" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M675 340 L635 320 M641.7194805917017 328.709109057633 L635 320 L645.9989756011274 320.1501190387815" stroke="#aa4b58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="570" font-family="sans-serif" font-size="21" fill="#173d36">Extension: triceps becomes the main extensor; biceps opposition decreases.</text><text x="65" y="610" font-family="sans-serif" font-size="21" fill="#173d36">Functional side-view sketch. Other flexors and co-contraction are not drawn.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
