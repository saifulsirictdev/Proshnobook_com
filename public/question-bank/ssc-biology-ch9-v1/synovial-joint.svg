<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Synovial joint: surfaces, fluid and stabilizers</title><desc id="desc">Two stylized bone ends face one another. A is articular cartilage, B is the fluid-filled cavity between the cartilage surfaces, C is the outer capsule. D represents a ligament linking the bones; fine lines inside the capsule represent synovial lining on the non-articular internal surface. Anatomy and layer thickness are enlarged and simplified. The diagram shows complementary lubrication and stability roles, not unlimited movement.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Synovial joint: surfaces, fluid and stabilizers</text><rect x="350" y="95" width="410" height="490" rx="12" fill="#f2e8d3" stroke="#173d36" stroke-width="2"/><path d="M440 105 L440 240 Q440 285 490 285 L620 285 Q670 285 670 240 L670 105" stroke="#173d36" stroke-width="4" fill="#e6d4bd" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 575 L440 420 Q440 375 490 375 L620 375 Q670 375 670 420 L670 575" stroke="#173d36" stroke-width="4" fill="#e6d4bd" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 240 Q440 285 490 285 L620 285 Q670 285 670 240 L670 265 Q670 310 620 310 L490 310 Q440 310 440 265 Z" stroke="#568f9d" stroke-width="3" fill="#bcdce0" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 420 Q440 375 490 375 L620 375 Q670 375 670 420 L670 395 Q670 350 620 350 L490 350 Q440 350 440 395 Z" stroke="#568f9d" stroke-width="3" fill="#bcdce0" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 160 L400 500 M710 160 L710 500" stroke="#9f7655" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 130 L365 550 M745 130 L745 550" stroke="#ac8b4a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="145" font-family="sans-serif" font-size="22" fill="#173d36">C  Joint capsule</text><path d="M235 155 L350 190 M341.9173214861225 182.53874621519262 L350 190 L339.1311255962471 191.69338985335463" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="270" font-family="sans-serif" font-size="22" fill="#173d36">A  Articular cartilage</text><path d="M260 280 L467 298 M457.5468084111156 292.37530722760386 L467 298 L456.71782866937195 301.9085742576559" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="390" font-family="sans-serif" font-size="22" fill="#173d36">B  Fluid-filled cavity</text><path d="M255 380 L545 330 M534.4261580576652 326.96786105553826 L545 330 L536.0520384167999 336.39796713851945" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="235" font-family="sans-serif" font-size="22" fill="#173d36">D  Ligament</text><path d="M780 245 L713 280 M723.9945786241498 279.6546872759516 L713 280 L719.5638469207231 271.1730008722492" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="425" font-family="sans-serif" font-size="21" fill="#173d36">Synovial lining</text><path d="M780 410 L745 455 M754.8577826081803 450.1190039899771 L745 455 L747.3042804138547 444.2440578388351" stroke="#173d36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="610" font-family="sans-serif" font-size="20" fill="#173d36">Simplified section: fluid + cartilage reduce friction; capsule + ligaments help stability.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
