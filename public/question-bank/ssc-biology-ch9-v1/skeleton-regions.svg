ll="#4d7fa3">Rib cage (axial)</text><path d="M560 292 L350 300 M360.07987785198884 304.4040961035137 L350 300 L359.7155995422148 294.84179047194516" stroke="#4d7fa3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="575" y="370" font-family="sans-serif" font-size="23" fill="#4d7fa3">Vertebral column (axial)</text><path d="M560 362 L303 385 M313.29198067200247 388.88267096817737 L303 385 L312.43899842956847 379.3515215635887" stroke="#4d7fa3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="575" y="440" font-family="sans-serif" font-size="23" fill="#ac7853">Pelvic girdle</text><path d="M560 432 L340 442 M350.1119600434388 446.32992656749485 L340 442 L349.6774431587859 436.7705551051313" stroke="#ac7853" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="575" y="510" font-family="sans-serif" font-size="23" fill="#ac7853">Limb bones</text><path d="M560 502 L355 535 M365.539443675751 538.1496233117108 L355 535 L364.0186079441271 528.702007403138" stroke="#ac7853" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="570" font-family="sans-serif" font-size="21" fill="#173d36">Selected regions only;</text><text x="520" y="605" font-family="sans-serif" font-size="21" fill="#173d36">not a 206-bone inventory.</text><text x="30" y="650" font-family="sans-serif" font-size="18" fill="#173d36">Original editorial schematic | not to scale | review draft</text></svg>
