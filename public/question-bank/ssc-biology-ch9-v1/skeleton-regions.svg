<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Human skeleton: selected support and movement regions</title><desc id="desc">A simplified frontal regional map. Blue marks selected axial structures: skull, rib cage and vertebral column. Brown marks appendicular structures: pectoral and pelvic girdles and limb bones. Ribs and vertebrae are deliberately not drawn in their true count, and small bones, sternum details and the sacrum are not individually resolved. The map identifies regions, not a full bone-count or clinical diagram.</desc><rect x="1" y="1" width="1098" height="678" rx="12" fill="#f4faf7" stroke="#173d36" stroke-width="2"/><text x="30" y="45" font-family="sans-serif" font-size="27" fill="#173d36">Human skeleton: selected support and movement regions</text><text x="45" y="95" font-family="sans-serif" font-size="22" fill="#4d7fa3">Blue: selected axial parts</text><text x="490" y="95" font-family="sans-serif" font-size="22" fill="#ac7853">Brown: selected appendicular parts</text><path d="M300 135 C255 135 250 210 300 215 C350 210 345 135 300 135 Z" stroke="#4d7fa3" stroke-width="4" fill="#dbe8ef" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 220 L300 430" stroke="#4d7fa3" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 265 Q255 245 245 270 Q260 285 300 275 M300 265 Q345 245 355 270 Q340 285 300 275" stroke="#4d7fa3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 285 Q255 265 245 290 Q260 305 300 295 M300 285 Q345 265 355 290 Q340 305 300 295" stroke="#4d7fa3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 305 Q255 285 245 310 Q260 325 300 315 M300 305 Q345 285 355 310 Q340 325 300 315" stroke="#4d7fa3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 325 Q255 305 245 330 Q26