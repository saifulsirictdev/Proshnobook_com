<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><title>NEURON: SIMPLIFIED SIGNAL PATH</title><desc>A dendritic branches, B cell body and nucleus, C axon, D terminal branches. Typical signal direction left to right.</desc><rect width="900" height="500" rx="20" fill="#f3f8f6"/><g font-family="DejaVu Sans, sans-serif" fill="#193e34" font-size="21"><text x="30" y="40" font-size="25">NEURON: SIMPLIFIED SIGNAL PATH</text><path d="M115 110 L210 230 L95 220 M110 350 L210 260 L80 300 M135 170 L210 240" fill="none" stroke="#56826b" stroke-width="9"/><path d="M205 215 Q275 170 330 240 Q290 320 205 275 Z" fill="#d0e3b5" stroke="#56826b" stroke-width="4"/><path d="M245 245 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="#a38cb1"/><path d="M325 245 H700 M700 245 L800 170 M700 245 L810 245 M700 245 L800 325" fill="none" stroke="#56826b" stroke-width="10"/><path d="M390 365 H640 L620 350 M640 365 L620 380" fill="none" stroke="#193e34" stroke-width="3"/><text x="90" y="90">A</text><text x="240" y="160">B</text><text x="480" y="210">C</text><text x="800" y="140">D</text><text x="380" y="415" font-size="18">Typical direction of signalling</text><text x="30" y="470" font-size="16">Original schematic. Not to scale. Written equivalent supplied in the question.</text></g></svg>
