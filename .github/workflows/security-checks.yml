name: Security regression checks
on:
  pull_request:
  push:
    branches: [main, arena/ef11ce66-questionmaker-com]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      auth-rate-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_rate
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: auth_rate_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U auth_rate -d auth_rate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Preservation regressions compare chapter bytes to pinned ancestor commits.
          # A depth-1 checkout cannot supply those historical trees.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency advisory gate
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Real PostgreSQL scoped SSC math release (disposable only)
        run: node scripts/ssc-math-release-postgres-check.cjs
        env:
          WALLET_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
      - name: Security tests (report failing TAP blocks)
        shell: bash
        run: |
          set +e
          npm run test:security > "$RUNNER_TEMP/security-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/security-tests.log"
          if [ "$status" -ne 0 ]; then
            awk '/^not ok / { remaining=30 } remaining>0 { print "::error::" $0; remaining-- }' "$RUNNER_TEMP/security-tests.log"
          fi
          exit "$status"

      - name: Real PostgreSQL auth concurrency regression (disposable only)
        run: node scripts/auth-attempts-postgres-check.cjs
        env:
          AUTH_RATE_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
      - name: Real PostgreSQL wallet checkout and recharge concurrency
        run: node scripts/wallet-postgres-check.cjs
        env:
          WALLET_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
      - name: Real PostgreSQL wallet transfers refunds withdrawals and reconciliation
        run: node scripts/wallet-transfer-postgres-check.cjs
        env:
          WALLET_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
      - name: Full-schema synthetic backup/restore and vault recovery rehearsal
        run: |
          node scripts/disposable-restore-check.cjs > "$RUNNER_TEMP/restore-result.json"
          cat "$RUNNER_TEMP/restore-result.json"
          echo '### Synthetic disposable restore rehearsal (not production restore)' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/restore-result.json" >> "$GITHUB_STEP_SUMMARY"
        env:
          RESTORE_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
          RESTORE_TEST_CONTAINER: ${{ job.services['auth-rate-postgres'].id }}
      - name: PDF browser/worker/render/print regression (local fixtures only)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-browser-tools" --ignore-scripts --no-package-lock playwright-core@1.65.1 esbuild@0.28.2
          export NODE_PATH="$RUNNER_TEMP/pdf-browser-tools/node_modules"
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          node scripts/pdf-browser-check.cjs
          node scripts/english-browser/class8-reference-check.cjs
          node scripts/english-browser/expanded-model-check.cjs
          ENGLISH_BROWSER_SET=junior-expansion-01 node scripts/english-browser/expanded-model-check.cjs
          WORD_WORKSPACE_OCR=1 node scripts/paper-browser/word-workspace-check.cjs
          node scripts/paper-browser/default-header-check.cjs
          node scripts/paper-browser/physics-auto-model-check.cjs
          node scripts/auto-model/check-subject-groups.cjs
          node scripts/auto-model/check-preparation-flow.cjs
      - name: Production build (no production credentials)
        run: npm run build
      - name: Full built app Credentials roles and mobile browser regression (isolated DB)
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/pdf-browser-tools/node_modules"
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          node scripts/authenticated-browser-check.cjs
        env:
          WALLET_TEST_DATABASE_URL: postgresql://auth_rate:disposable_ci_only@127.0.0.1:5439/auth_rate_test
      - name: Keep isolated English workflow proof (no production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-english-workflow-proof
          path: .cache/english-authenticated-flow/
          if-no-files-found: ignore
          retention-days: 7
