name: Production public liveness
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-health.yml'
      - 'scripts/public-*.cjs'
      - 'tests/public-health-monitor.test.cjs'
permissions:
  contents: read
concurrency:
  group: production-public-liveness
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public liveness twice before alerting
        id: probe
        continue-on-error: true
        run: node scripts/public-health-check.cjs > "$RUNNER_TEMP/public-health.json"
      - name: Record deduplicated incident or recovery
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const title = '[monitor] Production public liveness incident';
            const marker = '<!-- proshnobook-public-liveness:v1 -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let result = {ok:false,reason:'monitor_run_failed'};
            try { result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/public-health.json`,'utf8')); } catch {}
            const healthy = process.env.PROBE_OUTCOME === 'success' && result.ok === true;
            const allowed = new Set(['http_status','content_type','cached_liveness','security_header','empty_body','body_limit','payload','network_or_invalid_response','monitor_failed','monitor_run_failed','liveness_only']);
            const reason = allowed.has(result.reason) ? result.reason : 'monitor_run_failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo,state:'open',per_page:100});
            const incident = issues.find(i => !i.pull_request && i.title === title && i.user?.login === 'github-actions[bot]' && i.body?.includes(marker));
            if (!healthy && !incident) {
              await github.rest.issues.create({...context.repo,title,body:`${marker}\nPublic liveness probe failed after a retry, or the monitor could not run.\n\nReason: \`${reason}\`\nRun: ${run}\n\nCheck production deployment/transport and error rates. Do not retry financial operations blindly. This monitor does not test database, login, payments or provider readiness. GitHub notification delivery depends on repository subscription settings.`});
            } else if (healthy && incident) {
              await github.rest.issues.createComment({...context.repo,issue_number:incident.number,body:`Public liveness recovered. Run: ${run}\nThis is not proof of database/login/payment recovery; investigate those separately.`});
              await github.rest.issues.update({...context.repo,issue_number:incident.number,state:'closed',state_reason:'completed'});
            }
            await core.summary.addHeading('Public liveness only').addRaw(`Status: ${healthy ? 'PASS' : 'FAIL'}; reason: ${reason}.\n\nDoes not test database, OAuth, storage, payment or restore readiness. No test transactions or credentials used.`).write();
            if (!healthy) core.setFailed('Public liveness probe/monitor failed. Review the linked incident and workflow logs.');
  release-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only production liveness
        run: node scripts/public-health-check.cjs
      - name: Anonymous GET-only production release smoke
        run: node scripts/public-release-check.cjs
